<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Rodokmen — klinická genetika</title>
<style>
:root{--teal:#1F6B75;--navy:#1F3864;--line:#d8dde3;--ink:#12181f;
  --bg:#eef1f4;--panel:#fff;--muted:#5b6674}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:14px}
#app{display:flex;flex-direction:column;height:100vh}
#topbar{background:var(--navy);color:#fff;padding:4px 8px 5px;flex:0 0 auto}
#topbar .tbrow{display:flex;gap:2px;align-items:center;flex-wrap:wrap;
  padding:2px 0}
#topbar .tbrow+.tbrow{border-top:1px solid rgba(255,255,255,.16);margin-top:2px}
#topbar .tbtitle{font-size:14px;font-weight:700;min-width:80px;padding-right:4px}
#topbar .tbtitle.dim{font-size:10px;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;opacity:.55}
#topbar .grp{display:flex;gap:3px;align-items:center;padding:0 7px;
  border-right:1px solid rgba(255,255,255,.22)}
#topbar .grp:last-child{border-right:0}
#topbar .glab{font-size:10px;letter-spacing:.4px;text-transform:uppercase;
  opacity:.6;margin-right:3px}
#zLab{font-size:12px;min-width:40px;text-align:center;display:inline-block}
.aslab{font-size:10px;color:rgba(255,255,255,.6);margin-left:4px;white-space:nowrap;cursor:pointer}
button{font:inherit;font-size:13px;padding:5px 8px;border-radius:5px;
  border:1px solid #b9c2cc;background:#fff;color:var(--ink);cursor:pointer;
  white-space:nowrap}
button:hover{background:#eef4f7;border-color:var(--teal)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--teal);border-color:var(--teal);color:#fff}
button.big{background:var(--teal);border-color:#155059;color:#fff;font-weight:600}
button.big:hover{background:#25808c}
kbd{font:11px/1 monospace;background:#e8edf2;border:1px solid #c3ccd6;
  border-bottom-width:2px;border-radius:3px;padding:1px 4px;color:#333}
/* Lišta se ovládá hlavně klávesami — tlačítka stačí malá, ať se celá lišta
   vejde do DVOU řádků i na běžném notebooku (1280 px). */
#topbar button{font-size:12px;padding:3px 6px}
#topbar kbd{font-size:10px;padding:0 3px;border-bottom-width:1px}
#topbar .grp{padding:0 5px}
#main{flex:1 1 auto;display:flex;min-height:0}
/* hlášky v aplikaci místo alert()/confirm() (ty některé prohlížeče tiše
   blokují a zablokují i automatické testy) */
#msgbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 14px;
  font-size:13px;border-bottom:1px solid #EDD3A6;background:#FDF4E3;color:#7a4a00}
#msgbar[hidden]{display:none}
#msgbar.info{background:#E4F0F1;border-color:#B5D2D5;color:#17525A}
#msgbar.err{background:#fdecea;border-color:#f1b9b3;color:#a03127}
#msgbar .msgt{flex:1}
#msgbar button{font-size:12px;padding:3px 10px}
#sidebar{flex:0 0 314px;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:12px}
#stage{flex:1 1 auto;overflow:auto;padding:16px;display:flex;
  justify-content:flex-start;align-items:flex-start}
/* auto okraje vystředí kresbu, dokud se vejde; při přiblížení se srazí na 0,
   takže jde rolovat na obě strany */
#sheetwrap{flex:0 0 auto;margin:0 auto}
#sheet{transform-origin:top left}
#sidebar h2{margin:0 0 3px;font-size:15px;color:var(--navy)}
#sidebar h3{margin:15px 0 6px;font-size:11px;letter-spacing:.6px;
  text-transform:uppercase;color:var(--teal);border-bottom:1px solid var(--line);
  padding-bottom:3px}
.who{font-size:11px;color:var(--muted);margin:0 0 10px}
.fld{margin-bottom:8px}
.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.fld input,.fld textarea{width:100%;font:inherit;padding:5px 7px;
  border:1px solid #c3ccd6;border-radius:4px;background:#fff;color:var(--ink)}
.fld textarea{min-height:66px;resize:vertical;line-height:1.45}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--teal);
  outline-offset:-1px;border-color:var(--teal)}
.fld input.auto{color:#5b7f86;background:#f2f9fa;font-style:italic}
.fld input.bad{border-color:#c0392b;background:#fdf3f2;color:#a03127}
.warn{font-size:11px;color:#c0392b;margin:-3px 0 8px}
.fld label i{font-style:normal;color:#1F6B75;font-size:10px}
.fld label .lbhint{font-weight:400;opacity:.8;font-size:10.5px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.row2x2{display:grid;grid-template-columns:1fr 1fr;gap:5px 7px}
.trow{display:grid;grid-template-columns:1fr 52px 1fr auto 24px;gap:4px;
  margin-bottom:4px}
.trow select,.trow input{font:inherit;font-size:12px;padding:4px 5px;
  border:1px solid #c3ccd6;border-radius:4px;min-width:0}
.trow button{padding:2px 4px;font-size:13px;line-height:1}
.trowq{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin:-1px 0 6px}
.trowq select,.trowq input{font:inherit;font-size:12px;padding:4px 5px;
  border:1px solid #c3ccd6;border-radius:4px;min-width:0}
.grow{display:grid;grid-template-columns:1fr 24px;gap:4px;margin-bottom:4px}
.grow2{display:grid;grid-template-columns:1fr 1fr 40px;gap:4px;margin-bottom:4px}
.grow2.nosub{grid-template-columns:1fr 40px}
.grow2.one{grid-template-columns:1fr}
.grow select,.grow input,.grow2 select,.grow2 input{font:inherit;font-size:12px;padding:4px 5px;
  border:1px solid #c3ccd6;border-radius:4px;min-width:0}
.grow button{padding:2px 4px;font-size:13px;line-height:1}
.gsrc{font-size:10.5px;color:var(--muted);margin:0 0 8px}
.kbox{margin:7px 0 2px;font-size:11px;line-height:1.45}
.kok{background:#eef7ee;border-left:3px solid #2e7d32;padding:4px 6px;margin-bottom:3px}
.kchk{background:#fff7e8;border-left:3px solid #b26a00;padding:4px 6px;margin-bottom:3px}
.kbox i{color:#6b7682}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{padding:4px 7px;font-size:12px}
.tflag{display:flex;align-items:center;justify-content:space-between;gap:6px;
  margin:2px 0 5px;font-size:11.5px}
.tflag span{color:var(--muted);flex:1}
.tflag .chips{flex:0 0 auto}
.tflag button{padding:3px 6px;font-size:11px}
.hint{font-size:11px;color:var(--muted);line-height:1.5;margin:8px 0 0}
#nobody{color:var(--muted);font-size:13px;line-height:1.7}
/* Sbalovací sekce panelu: všechno zůstává dostupné, ale co není vyplněné,
   nezabírá místo — panel se zkrátí z jednoho dlouhého svitku na přehled,
   kde je hned vidět, co osoba má vyplněné (hodnota se ukazuje vpravo
   v záhlaví i zavřené sekce). Rozbalení si panel pamatuje. */
.sec{margin:14px 0 0;border-bottom:1px solid var(--line)}
.sec>summary{font-size:11px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--teal);padding:0 0 3px;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:6px;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:'▶';font-size:8px;opacity:.7;width:9px}
.sec[open]>summary::before{content:'▼'}
.sec>summary:hover{color:var(--navy)}
.sec>summary .val{margin-left:auto;text-transform:none;letter-spacing:0;
  color:var(--muted);font-size:10.5px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:150px}
.sec>*:not(summary){margin-top:6px}
.sec[open]{padding-bottom:9px}

#sheet{width:297mm;min-height:210mm;background:#fff;
  box-shadow:0 2px 14px rgba(20,30,45,.18);padding:8mm;
  display:flex;flex-direction:column;flex:0 0 auto}
#idbar{display:flex;gap:5mm;align-items:flex-end;
  border-bottom:1.2pt solid var(--navy);padding-bottom:2mm;margin-bottom:1mm}
#idbar .f{display:flex;flex-direction:column;gap:1px}
#idbar .f.wide{flex:1 1 auto}
#idbar span{font-size:7.5pt;color:var(--muted);letter-spacing:.3px}
#idbar input{font:inherit;font-size:10pt;border:0;border-bottom:.6pt dotted #9aa5b1;
  padding:1px 2px;background:transparent;color:var(--ink);width:100%}
#idbar input:focus{outline:0;border-bottom-color:var(--teal);background:#f4fbfc}
#idbar .ttl{font-size:11pt;font-weight:700;color:var(--navy);white-space:nowrap;
  padding-bottom:1px}
#drawwrap{flex:1 1 auto}
#ped{display:block;width:100%;height:auto;max-height:188mm}
#notes{flex:0 0 auto;border-top:1.2pt solid var(--navy);margin-top:1.5mm;
  padding-top:1.5mm}
#notes .nh{font-size:8pt;font-weight:700;color:var(--navy);margin:0 0 1.5mm}
#notecols{column-count:3;column-gap:7mm;column-rule:.4pt solid #ccd3da}
#notecols .n{font-size:8.2pt;line-height:1.5;margin:0 0 1.6mm;break-inside:avoid}
#notecols .n b{color:var(--navy)}
#kritline{margin-top:1.5mm;border-top:.4pt solid #dde2e7;padding-top:1mm}
#kritline .kh{font-size:7.5pt;font-weight:700;color:var(--navy);margin-bottom:.8mm}
#kritline .kl{font-size:7.6pt;line-height:1.45}
#kritline .kw{font-size:6.6pt;color:var(--muted);margin-top:.8mm;font-style:italic}
#legend{font-size:6.8pt;color:var(--muted);margin-top:1.5mm;
  border-top:.4pt solid #dde2e7;padding-top:1mm;line-height:1.5}
#ped text{font-family:"Segoe UI",Arial,sans-serif;fill:#000;
  paint-order:stroke fill;stroke:#fff;stroke-width:3.4px;
  stroke-linejoin:round;stroke-linecap:round}
.sym{fill:#fff;stroke:#000;stroke-width:2.1;cursor:pointer}
.sym.aff{fill:#000}
.sym.sel{stroke:#c0392b;stroke-width:3.6}
.hit{fill:transparent;cursor:pointer}
.conn{stroke:#000;stroke-width:1.7;fill:none}
.idl{font-size:12px;font-weight:600}
.cnd{font-size:11.5px;fill:#111}
.key{font-size:11px;font-weight:700;fill:#1F3864}
.prb{font-size:20px;font-weight:700;fill:#000}
.gtag{font-size:13px;font-weight:700;fill:#98a2ae}
@media print{
  html,body{background:#fff}
  #topbar,#sidebar,.noprint{display:none!important}
  #app{height:auto;display:block}#main{display:block}
  #stage{padding:0;display:block;overflow:visible}
  #drawwrap{flex:none}#notes{break-inside:avoid}
  #idbar input{border-bottom:.6pt dotted #666}
}
/* =====================================================================
   VZHLED OVLÁDÁNÍ (2026-09-29) — podle aplikace „Objektivní nález“:
   světlé pozadí, bílé karty se zaoblením, tichá horní lišta, teal akcenty,
   jemné zaměření polí. JEN @media screen a JEN ovládání (lišta, panel,
   pozadí) — list A4 (hlavička, kresba, poznámky, legenda) a tisk/PDF se
   nemění; proměnné --muted/--navy/--line, které list používá, zůstávají.
   ===================================================================== */
@media screen{
  :root{--ui-bg:#F3F4F2;--ui-card:#fff;--ui-ink:#1B1F22;--ui-mid:#4B5359;
    --ui-faint:#8A9297;--ui-line:#E0E3E2;--ui-soft:#EDEFEE;--ui-hover:#EFF3F3;
    --ui-teal:#1F6B75;--ui-teal-ink:#17525A;--ui-teal-bg:#E4F0F1;--ui-teal-edge:#B5D2D5;
    --ui-green:#2E7D4F;--ui-green-bg:#E7F2EB;--ui-green-edge:#B3D2BF;
    --ui-amber:#A85B00;--ui-amber-bg:#FDF4E3;--ui-amber-edge:#EDD3A6;
    --ui-font:"Segoe UI Variable Text","Segoe UI",system-ui,Arial,sans-serif}
  html,body{background:var(--ui-bg);color:var(--ui-ink);font-family:var(--ui-font);
    -webkit-font-smoothing:antialiased}

  /* ---- horní lišta: bílá, tichá; skupiny oddělené jemnou čarou ---- */
  #topbar{background:rgba(255,255,255,.97);color:var(--ui-ink);
    border-bottom:1px solid var(--ui-line);padding:5px 10px 6px}
  #topbar .tbrow+.tbrow{border-top:1px solid var(--ui-soft);margin-top:3px;padding-top:4px}
  #topbar .tbtitle{color:#1F3864;font-weight:600;letter-spacing:-.01em;min-width:0;padding-right:8px}
  #topbar .grp{border-right:1px solid var(--ui-line)}
  #topbar .glab{color:var(--ui-faint);opacity:1;font-weight:600;letter-spacing:.06em}
  #zLab{color:var(--ui-mid)}
  .aslab{color:var(--ui-faint)}
  #topbar button{background:#fff;border:1px solid var(--ui-line);border-radius:7px;color:var(--ui-teal-ink)}
  #topbar button:hover{background:var(--ui-teal-bg);border-color:var(--ui-teal-edge)}
  #topbar button.big,#topbar button.on{background:var(--ui-teal);border-color:var(--ui-teal);
    color:#fff;font-weight:600}
  #topbar button.big:hover,#topbar button.on:hover{filter:brightness(1.08);background:var(--ui-teal)}
  #topbar button:disabled{opacity:.45;background:#fff}
  #topbar button#bDel:hover{background:var(--ui-amber-bg);border-color:var(--ui-amber-edge);color:var(--ui-amber)}
  kbd{font:10.5px/1.2 ui-monospace,"Cascadia Mono",Consolas,monospace;background:var(--ui-soft);
    border:1px solid var(--ui-line);border-bottom-width:2px;border-radius:4px;color:var(--ui-mid)}
  #topbar button.big kbd,#topbar button.on kbd,.chips button.on kbd{background:rgba(255,255,255,.22);
    border-color:rgba(255,255,255,.35);color:#fff}

  /* ---- plocha s listem ---- */
  #stage{background:var(--ui-bg)}
  #sheet{box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 28px rgba(20,30,45,.10);border-radius:2px}

  /* ---- postranní panel: šedé pozadí, sekce jako bílé karty ---- */
  #sidebar{background:var(--ui-bg);border-right:1px solid var(--ui-line);padding:12px 12px 24px;
    scrollbar-width:thin;scrollbar-color:#cfd5d4 transparent}
  #sidebar h2{position:sticky;top:-12px;z-index:2;margin:-12px -12px 0;padding:12px 14px 2px;
    background:var(--ui-bg);font-size:17px;font-weight:600;color:#1F3864;letter-spacing:-.01em}
  #sidebar .who{font-size:12px;color:var(--ui-faint);margin:0 2px 10px}
  #nobody{background:#fff;border:1px solid var(--ui-line);border-radius:12px;padding:12px 14px;
    color:var(--ui-mid);font-size:13px}
  #nobody b{color:#1F3864}

  /* roky narození/úmrtí — první věc, kterou se vyplňuje, v samostatné kartě */
  .row2x2{background:#fff;border:1px solid var(--ui-line);border-radius:12px;padding:10px 12px 2px;
    margin-bottom:8px}

  .sec{background:#fff;border:1px solid var(--ui-line);border-radius:12px;margin:8px 0 0;padding:0 12px}
  .sec[open]{padding-bottom:10px}
  .sec>summary{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ui-ink);
    padding:9px 0;min-height:36px;gap:8px;white-space:nowrap}
  .sec[open]>summary{border-bottom:1px solid var(--ui-soft);margin-bottom:8px;color:#1F3864}
  .sec>summary:hover{color:var(--ui-teal)}
  .sec>summary::before{content:'';width:6px;height:6px;border:solid var(--ui-faint);
    border-width:0 1.6px 1.6px 0;transform:rotate(-45deg);margin:0 3px 0 1px;opacity:1;
    transition:transform .15s;flex:none}
  .sec[open]>summary::before{content:'';transform:rotate(45deg);margin-top:-3px}
  /* co je v sekci vyplněné, je vidět i zavřené — jako štítek */
  .sec>summary .val{font-size:11.5px;font-weight:500;color:var(--ui-teal-ink);background:var(--ui-teal-bg);
    border-radius:10px;padding:1px 8px;max-width:42%;min-width:0;flex:0 1 auto}
  .sec>*:not(summary){margin-top:0}
  .sec>.chips+.chips,.sec>.chips+.fld,.sec>.fld+.chips{margin-top:8px}

  /* pole */
  .fld label{font-size:11.5px;color:var(--ui-mid)}
  .fld input,.fld textarea,.trow select,.trow input,.trowq select,.trowq input,
  .grow select,.grow input,.grow2 select,.grow2 input{border:1px solid var(--ui-line);
    border-radius:7px;background:#fff;color:var(--ui-ink)}
  .fld input,.fld textarea{padding:6px 8px}
  .fld input:focus,.fld textarea:focus,.trow select:focus,.trow input:focus,.trowq select:focus,
  .trowq input:focus,.grow select:focus,.grow input:focus,.grow2 select:focus,.grow2 input:focus{
    outline:none;border-color:var(--ui-teal);box-shadow:0 0 0 3px var(--ui-teal-bg)}
  .fld input.auto{background:var(--ui-teal-bg);border-color:var(--ui-teal-edge);color:var(--ui-teal-ink)}
  .fld input.bad,.trow input.bad,.grow2 input.bad{border-color:var(--ui-amber-edge);
    background:var(--ui-amber-bg);color:var(--ui-amber)}
  .fld label i{color:var(--ui-teal)}
  .warn{font-size:12px;color:var(--ui-amber);background:var(--ui-amber-bg);border:1px solid var(--ui-amber-edge);
    border-radius:8px;padding:5px 9px;margin:0 0 8px}
  .hint{font-size:11.5px;color:var(--ui-faint)}
  #sidebar h3{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ui-faint);
    border-bottom:1px solid var(--ui-soft);margin:6px 0 8px}

  /* přepínače: klidné, vybrané plnou barvou */
  #sidebar button{border:1px solid var(--ui-line);border-radius:7px;background:#fff;color:var(--ui-mid)}
  #sidebar button:hover{background:var(--ui-hover);border-color:var(--ui-teal-edge);color:var(--ui-ink)}
  #sidebar button.on{background:var(--ui-teal);border-color:var(--ui-teal);color:#fff;font-weight:500}
  .chips{gap:5px}
  .chips button{padding:4px 9px;font-size:12.5px}
  /* přidat řádek — čárkovaně, ať je jasné, že tím něco přibude */
  #sidebar button[data-tadd],#sidebar button[data-gadd]{border-style:dashed;border-color:var(--ui-teal-edge);
    color:var(--ui-teal-ink);background:transparent}
  #sidebar button[data-tadd]:hover,#sidebar button[data-gadd]:hover{background:var(--ui-teal-bg)}
  /* odebrat řádek — nenápadné, varovná barva až na najetí */
  #sidebar button[data-trm],#sidebar button[data-grm]{border-color:transparent;background:transparent;color:var(--ui-faint)}
  #sidebar button[data-trm]:hover,#sidebar button[data-grm]:hover{background:var(--ui-amber-bg);
    border-color:var(--ui-amber-edge);color:var(--ui-amber)}
  .trow,.grow{margin-bottom:5px}
  .gsrc{color:var(--ui-faint);font-size:11px;margin:1px 0 10px}
  .tflag span{color:var(--ui-mid)}

  /* výsledek kritérií v panelu */
  .kbox{font-size:11.5px}
  .kok{background:var(--ui-green-bg);border:1px solid var(--ui-green-edge);border-left:3px solid var(--ui-green);
    border-radius:8px;padding:5px 8px;margin-bottom:5px}
  .kchk{background:var(--ui-amber-bg);border:1px solid var(--ui-amber-edge);border-left:3px solid var(--ui-amber);
    border-radius:8px;padding:5px 8px;margin-bottom:5px}

  /* okno „Genealogie → text“ */
  #txtov>div{border-radius:14px!important;box-shadow:0 16px 48px rgba(0,0,0,.2)}
  #txtov textarea{border-color:var(--ui-line)!important;border-radius:9px!important;
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace!important}
  #txtov textarea:focus{outline:none;border-color:var(--ui-teal)!important;box-shadow:0 0 0 3px var(--ui-teal-bg)}
  #txtov button{border:1px solid var(--ui-line);border-radius:8px;background:#fff;color:var(--ui-teal-ink)}
  #txtov button:hover{background:var(--ui-teal-bg);border-color:var(--ui-teal-edge)}
  #txtov button.on,#txtov button.big{background:var(--ui-teal);border-color:var(--ui-teal);color:#fff}
}
</style>
</head>
<body>
<div id="app">
<div id="topbar">
  <div class="tbrow">
    <span class="tbtitle">Rodokmen</span>
    <div class="grp"><span class="glab">Nový</span>
      <button class="big" id="bStd">Standardní</button>
      <button id="bBlank">Prázdný</button></div>
    <div class="grp compact"><span class="glab" title="Přidat k vybrané osobě">Přidat</span>
      <button data-add="par" title="Doplní otce i matku">Rodiče <kbd>R</kbd></button>
      <button data-add="sib" title="Vlastní sourozenec – oba rodiče společní">Sourozenec <kbd>S</kbd></button>
      <button data-add="child" title="Potomek – opakovaným klikáním přidáte další děti témuž páru">Potomek <kbd>P</kbd></button>

function formatBlock(block, maxWidth) {
  const padding = ' '.repeat(block.indentWidth);
  const tokens = block.tokens;
  const rows = [];
  let prefix = block.firstPrefix;
  let words = [];
  let overlong = 0;
  const rowText = (p, w) => (p + w.join(' ')).replace(/\s+$/, '');
  const fits = (p, w) => rowText(p, w).length <= maxWidth;

  for (let i = 0; i < tokens.length; i++) {
    const word = tokens[i];
    if (fits(prefix, words.concat(word))) { words.push(word); continue; }
    if (!words.length) { words.push(word); overlong++; continue; }   // one token wider than a row

    // Start a new row at `word`. Carry words down while the new row would start
    // risky, or the row above would end in "word:" (read back as a heading).
    const ahead = tokens.slice(i, i + 4);
    const carry = [];
    const risky = () => isRiskyRowStart(carry.concat(ahead).join(' ')) || /:$/.test(words[words.length - 1]);
    while (words.length > 1 && risky() && fits(padding, [words[words.length - 1]].concat(carry, word))) {
      carry.unshift(words.pop());
    }
    if (carry.length && risky()) { words.push(...carry); carry.length = 0; }   // can't fix it: plain wrap
    rows.push(rowText(prefix, words));
    prefix = padding;
    words = carry.concat(word);
    if (!fits(prefix, words)) overlong++;

function fixOrphan(lines, padding, maxWidth) {
  if (lines.length < 2) return;
  const lastIdx = lines.length - 1;
  const prevIdx = lastIdx - 1;

  const lastTrimmed = lines[lastIdx].trim();
  if (!lastTrimmed || lastTrimmed.includes(' ')) return;
  if (lastTrimmed.length >= ORPHAN_MIN_TAIL) return;

  const prevLine = lines[prevIdx];
  const lead = prevLine.match(/^\s*/)[0];
  const prevWords = prevLine.slice(lead.length).split(/\s+/).filter(Boolean);
  if (prevWords.length < 3) return;

  const moved = prevWords.pop();
  const newLast = padding + moved + ' ' + lastTrimmed;
  if (newLast.length > maxWidth || isRiskyRowStart(moved + ' ' + lastTrimmed)) return;
  if (/:$/.test(prevWords[prevWords.length - 1])) return;   // row above would read as a heading

 *   English keyboard      -> cp1252 -> each character is replaced by the cp1252

 * and reported. The HTML copy keeps the real text for other programs. */

    e.clipboardData.setData('text/html', html);

  try { document.execCommand('copy'); } catch (e) { /* fall back below */ }
  document.removeEventListener('copy', onCopy);

async function copyForAmis(text) {

/* přátelštější tvar pro našeptávač — motor porovnává jen podřetězec, takže
   delší/hezčí slovo (obsahující tento kód) funguje k vyhodnocení stejně */
var DETLABEL={difuz:'difuzní',lobul:'lobulární',medul:'medulární',
  metastat:'primárně metastatický',bilat:'bilaterální',multifok:'multifokální'};
/* z KRITERIA.pravidla automaticky odvodí, jaké hodnoty pole "detail" motor
   kritérií pro danou diagnózu skutečně vyhodnocuje — našeptávač se tak nikdy
   nerozejde s tím, co se opravdu kontroluje (AKTUALIZACE: měňte jen KRITERIA,
   tohle se dopočítá samo) */
var DETBY={};
(function(){
  function add(c,det){
    if(!det)return;
    (c instanceof Array?c:[c]).forEach(function(code){
      if(!DETBY[code])DETBY[code]=[];
      if(DETBY[code].indexOf(det)<0)DETBY[code].push(det);
    });
  }
  function scan(conds){(conds||[]).forEach(function(c){add(c.c,c.det);});}
  KRITERIA.pravidla.forEach(function(r){
    scan(r.osoba);scan(r.rodina);
    (r.osobaAny||[]).forEach(scan);(r.rodinaAny||[]).forEach(scan);
  });
})();
/* čistě informativní pojmy bez vlastní podmínky v motoru — jen běžná
   terminologie k dané diagnóze (na vyhodnocení kritérií nemá vliv) */

   indikací — aby šly aktivně zvolit a bylo vidět, že se u nich nic nerozsvítí,

/* ---------- text bez diakritiky pro porovnávání ---------- */
function knorm(s){return String(s||'').toLowerCase()
 .replace(/[áàâä]/g,'a').replace(/[éěèê]/g,'e').replace(/[íì]/g,'i')
 .replace(/[óòô]/g,'o').replace(/[úůù]/g,'u').replace(/[ýÿ]/g,'y')
 .replace(/č/g,'c').replace(/ď/g,'d').replace(/ň/g,'n').replace(/ř/g,'r')
 .replace(/š/g,'s').replace(/ť/g,'t').replace(/ž/g,'z');}

/* rodiče pro účely POKREVNÍ příbuznosti — adoptovaná osoba nesdílí DNA se
   svým pu-svazkem, takže se pro kfam/kphi chová, jako by (biologické)
   rodiče nebyly zadané. Vizuální umístění ve stromu (parentsOf) tím není
   dotčené — mění se jen dědičný výpočet rizika. */
function biolParentsOf(id){
  return (P[id]&&P[id].adopt)?[null,null]:parentsOf(id);
}
/* ---------- stupeň příbuznosti z koeficientu příbuznosti ---------- */
var _phi={};
function kphi(a,b){
  if(!a||!b||!P[a]||!P[b])return 0;
  var k=(+a<+b)?(a+'|'+b):(b+'|'+a);
  if(_phi[k]!==undefined)return _phi[k];
  _phi[k]=0;
  var r=0;
  if(a==b){
    var s=biolParentsOf(a);
    r=0.5*(1+((s[0]&&s[1])?kphi(s[0],s[1]):0));
  } else {
    var ga=(gen[a]||0),gb=(gen[b]||0);
    var x=(ga>=gb)?a:b, y=(ga>=gb)?b:a;
    var pp=biolParentsOf(x);
    if(pp[0]||pp[1])
      r=0.5*((pp[0]?kphi(pp[0],y):0)+(pp[1]?kphi(pp[1],y):0));
    else if(!P[a].adopt&&!P[b].adopt&&P[a].pu&&P[a].pu===P[b].pu)
      /* sourozenci se stejným svazkem rodičů, i když rodiče samotní ještě
         nejsou do rodokmenu zadaní jako osoby — jinak by přes ně nešlo
         dopočítat příbuznost vůbec (viz „Sourozenec“ bez „Rodiče“). Pokud je
         ale jeden z nich do svazku jen adoptovaný, pokrevní nejsou. */
      r=0.25;
  }
  _phi[k]=r;return r;
}
function kdegree(a,b){
  if(a==b)return 0;
  var r=2*kphi(a,b);
  if(!(r>0))return 99;
  var d=Math.round(-Math.log(r)/Math.LN2);
  return d<1?1:d;
}

var STAGE_RANK={cT1:1,cT2:2,cT3a:3,cT3b:4,cT4:5};
/* ---------- porovnání jednoho nádoru s podmínkou ----------
   2 = splňuje, 1 = splňuje kromě neznámého věku, 0 = nesplňuje */
function ktumMatch(t,c,owner){
  if(!t)return 0;
  if(c.c){
    var codes=(c.c instanceof Array)?c.c:[c.c];
    if(codes.indexOf(t.c)<0)return 0;
  }
  /* c.det (pokud ho nějaké pravidlo ještě používá) je krátký vnitřní klíč —
     pro porovnání se použije jeho plný popisek (DETLABEL). Skutečné
     ano/ne vlastnosti (TNBC, MSI, difuzní typ, ...) ale NEJSOU na volném
     textu vůbec — volný text neumí negaci ("MSI negativní" by přes
     podřetězec chybně "splnilo" MSI+) — mají vlastní pole c.flag/t.flags
     (viz níže), kde se musí výslovně zvolit "ano". Stejně tak prahové
     hodnoty (PSA, Gleason skóre, počet polypů, stádium) mají vlastní
     číselná/výběrová pole, ne volný text. */
  if(c.det&&knorm(t.det).indexOf(knorm(DETLABEL[c.det]||c.det))<0)return 0;
  var soft=false;
  if(c.flag){
    var fv=t.flags&&t.flags[c.flag];
    if(fv==='ne')return 0;
    if(fv!=='ano'){
      /* nevyplněno: u samostatných pravidel (bez osobaAny/rodinaAny
         alternativy) je bezpečné dát "1" — jen připomene, ať se typ
         doplní, nehrozí přehlasování jiné, prokazatelně nevyhovující
         větve (viz komentář k OR-fallacy u GS/PSA/stádia výše). Rovnou
         "ne" zůstává vždy 0 — to už bylo aktivně vyloučeno.
         Nevrací se ale hned: věk, pohlaví a ostatní pevné podmínky se
         musí prověřit i tak — jinak by C34 v 70 letech dostal „*“ za
         pravidlo „≤ 40 let u nekuřáka“, které věk už vylučuje. */
      if(!c.flagSoft)return 0;
      soft=true;
    }
  }
  /* chybějící hodnota = "nesplňuje", ne "ověřit": GS/PSA/stádium/počet
     polypů jsou tři NEZÁVISLÉ, navzájem zastupitelné cesty ke stejnému
     kritériu (viz "vysoce rizikový C61" — kterákoli z nich stačí). Kdyby
     chybějící pole vracelo 1 (jako neznámý věk), vyhrálo by přes
     osobaAny nad opravdu vyplněnou a prokazatelně nevyhovující hodnotou
     na sesterské podmínce (např. vyplněné PSA=5 by přehlasovalo
     nevyplněné GS/stádium) — kritérium by se pak nesprávně tvářilo jako
     "ověřit", i když je z dostupných dat jasné, že nesplňuje. */
  if(c.gsMin!==undefined){var gA=numF(t.gs);if(gA===null||gA<c.gsMin)return 0;}
  if(c.gsExact!==undefined){var gB=numF(t.gs);if(gB===null||gB!==c.gsExact)return 0;}
  if(c.psaMin!==undefined){var ps=numF(t.psa);if(ps===null||!(ps>c.psaMin))return 0;}
  if(c.polypMin!==undefined){var pc=numF(t.polypCount);if(pc===null||!(pc>c.polypMin))return 0;}
  if(c.stageMin!==undefined){
    if(!t.stage||!(STAGE_RANK[t.stage]>=STAGE_RANK[c.stageMin]))return 0;
  }
  if(c.muz&&(!owner||owner.sex!=='M'))return 0;
  if(c.mrtvy&&(!owner||!owner.dead))return 0;
  if(c.netestovan&&owner&&owner.tested)return 0;
  var a=num(t.age),need=(c.vekMax!==undefined||c.vekMin!==undefined);
  if(need&&a===null)return 1;
  if(c.vekMax!==undefined&&a>c.vekMax)return 0;
  if(c.vekMin!==undefined&&a<c.vekMin)return 0;
  return soft?1:2;
}
/* skupina podmínek proti nádorům jedné osoby, každá spotřebuje jiný nádor */
/* Přiřazení nádorů k podmínkám: každá podmínka potřebuje `pocet` RŮZNÝCH
   nádorů. Dřív se bral vždy první vyhovující nádor (hladově) — podmínky
   „C50 kdykoli“ + „C50 ≤ 40“ proti nádorům [C50 v 35, C50 v 60] pak
   neprošly, protože první podmínka „spotřebovala“ ten mladší (audit 5.10.,
   D2). Nyní se projdou všechna přiřazení (nádorů je u jedné osoby pár)
   a vybere se to s nejlepší úrovní shody (2 = jisté, 1 = chybí údaj). */
function kgroup(conds,p){
  var tums=p.tum||[];
  var lv=conds.map(function(c){return tums.map(function(t){return ktumMatch(t,c,p);});});
  var used={},found=[],best=null;
  function rec(ci,k,minJ,st){
    if(best&&best.st===2)return;                 /* lepší už to nebude */
    if(ci===conds.length){
      if(!best||st>best.st)best={ok:true,st:st,tum:found.slice()};
      return;
    }
    var need=conds[ci].pocet||1;
    if(k===need){rec(ci+1,0,0,st);return;}
    for(var j=minJ;j<tums.length;j++){
      if(used[j]||!lv[ci][j])continue;
      used[j]=1;found.push(tums[j]);
      rec(ci,k+1,j+1,Math.min(st,lv[ci][j]));
      found.pop();used[j]=0;
    }
  }
  rec(0,0,0,2);

/* podmínka u příbuzných */

     „OA + RA: …“ pod rodokmenem (přání 11. 10.: ať je dohledatelné proč) */
  var st=2,all=[],ev=[];
  for(var i=0;i<conds.length;i++){
    var c=conds[i],need=c.pocet||1,hits=[],ev1=[],worst=2;
    /* pocet zde znamená počet příbuzných, ne počet nádorů u jedné osoby */
    var c1={};for(var kk in c)if(kk!=='pocet')c1[kk]=c[kk];
    Object.keys(P).forEach(function(q){
      if(q==p.id)return;
      var d=kdegree(p.id,q);
      /* tabulka SLG ČLS JEP: "pokud není uvedeno jinak, jedná o příbuzné
         1. a 2. stupně" — bez explicitního stupenMax se tedy nesmí počítat
         bratranci/sestřenice a další příbuzní 3. stupně */
      if(d>(c.stupenMax||2))return;
      var g=kgroup([c1],P[q]);
      if(g.ok){hits.push(q);ev1.push({id:q,t:g.tum[0]});if(g.st<worst)worst=g.st;}
    });
    if(c.navzajem&&hits.length>=2){
      var rel=false;
      for(var a=0;a<hits.length&&!rel;a++)
        for(var b=a+1;b<hits.length&&!rel;b++)
          if(kphi(hits[a],hits[b])>0)rel=true;
      if(!rel)return {ok:false};
    }
    if(hits.length<need)return {ok:false};
    if(worst<st)st=worst;
    all=all.concat(hits);ev=ev.concat(ev1);

/* stejné jako kfam(), ale "pocet" tu znamená počet nádorů u JEDNOHO

   různých příbuzných — pocet se proto na rozdíl od kfam() nestrhává */
function kfamMulti(conds,p){
  var st=2,ev=[];
  for(var i=0;i<conds.length;i++){
    var c=conds[i],found=false,worst=2;
    Object.keys(P).forEach(function(q){
      if(q==p.id||found)return;
      var d=kdegree(p.id,q);
      if(d>(c.stupenMax||2))return;
      var g=kgroup([c],P[q]);
      if(g.ok){found=true;ev=ev.concat(g.tum.map(function(t){return {id:q,t:t};}));
        if(g.st<worst)worst=g.st;}
    });

    if(worst<st)st=worst;

/* vyhodnocení všech pravidel pro jednu osobu */
var _kritC={};
function kritFor(id){
  if(_kritC[id])return _kritC[id];
  var p=P[id];if(!p)return [];
  var out=[];
  KRITERIA.pravidla.forEach(function(r){
    var st=2,tum=[];
    if(r.muz&&p.sex!=='M')return;
    if(r.osoba){var g=kgroup(r.osoba,p);if(!g.ok)return;
      st=Math.min(st,g.st);tum=g.tum;}
    if(r.osobaAny){
      var best=null;
      r.osobaAny.forEach(function(grp){var g2=kgroup(grp,p);
        if(g2.ok&&(!best||g2.st>best.st))best=g2;});
      if(!best)return;st=Math.min(st,best.st);tum=tum.concat(best.tum);
    }
    /* „při úmrtí osoby s C25 / C56 bez genetického vyšetření každý příbuzný
       1. stupně“ (třetí sloupec tabulky) — pamatujeme si, KTERÝ zemřelý
       příbuzný pravidlo spustil, aby šel v souhrnu pod rodokmenem jmenovat */
    var subst=null,ev=[];
    if(r.rodina){var f=kfam(r.rodina,p);if(!f.ok)return;st=Math.min(st,f.st);ev=ev.concat(f.ev);
      if(r.rodina.some(function(c){return c.mrtvy;}))subst=f.hits;}
    if(r.rodinaMnohoc){var fm=kfamMulti(r.rodinaMnohoc,p);if(!fm.ok)return;st=Math.min(st,fm.st);ev=ev.concat(fm.ev);}
    if(r.rodinaAny){
      var okAny=false,bs=0,bev=[];
      r.rodinaAny.forEach(function(grp){var f2=kfam(grp,p);
        if(f2.ok){okAny=true;if(f2.st>bs){bs=f2.st;bev=f2.ev;}}});
      if(!okAny)return;st=Math.min(st,bs);ev=ev.concat(bev);
    }
    if(r.alesponJeden&&tum.length){
      var any=false,unk=false;
      tum.forEach(function(t){var a=num(t.age);
        if(a===null)unk=true;
        else if(r.alesponJeden.vekMax!==undefined&&a<=r.alesponJeden.vekMax)any=true;});
      if(!any&&!unk)return;
      if(!any)st=1;
    }
    if(r.rucni)st=1;
    out.push({dg:r.dg,typ:r.typ,popis:r.popis||'',st:st,rucni:r.rucni||'',zdroj:r.zdroj||'',

/* skloňování počtu osob/sourozenců (1 / 2–4 / 5+) */
function czCount(n,one,few,many){return n+' '+(n===1?one:(n<5?few:many));}
/* ------------------------------------------------------------------
   KDO MÁ BÝT VYŠETŘEN — výhradně podle tabulky SLG ČLS JEP 9. 10. 2024
   (onkogenetika.cz/kriteria.html):
   • sloupec „individuální“ i „kombinovaná OA + RA“ jmenují vždy osobu,
     která nádor MÁ („pacientka s C50 + …“) — k vyšetření je tedy ona;
   • jen u C25 a C56/C57/C48.2 třetí sloupec jmenuje příbuzné: „při úmrtí
     osoby s … bez genetického vyšetření každý příbuzný 1. stupně“
     (i nezletilí — tabulka věkovou hranici neuvádí);
   • „Cílené genetické vyšetření je indikováno genetikem v případě výskytu
     známé germinální patogenní varianty v rodině“ — KOMU, tabulka neříká,
     proto se jen uvede jedním řádkem pro rodinu a nikdo se neoznačí.
   Označení „*“ i řádek v souhrnu dostane jen ten, kdo žije a výsledek
   vyšetření zatím nemá. Zemřelí se vynechávají (u C25/C56 za ně nastupují
   příbuzní samostatným řádkem); nic mimo tabulku se nedomýšlí.
   ------------------------------------------------------------------ */
function testable(p){return !!(p&&!p.dead&&!p.tested&&!p.special);}
function indicatedFor(id){return testable(P[id])?kritFor(id):[];}
/* „*“ jisté splnění (st 2), „*?“ jen možné (st 1 — chybí údaj), jinak nic */
function indMark(id){
  var r=indicatedFor(id);if(!r.length)return '';
  return r.some(function(x){return x.st===2;})?'*':'*?';
}
/* pozitivní výsledek v rodině → cílené vyšetření */
function positiveTested(){
  return Object.keys(P).filter(function(i){
    return P[i].tested==='E+'||P[i].tested==='+/−';});
}
function kritLines(){
  if(!KRIT)return [];
  /* Souhrn pod rodokmenem býval řádek na každou osobu — u rodiny, kde
     kritérium splňuje celá sourozenecká řada, to byl sloupec osmi skoro
     totožných řádků a zabíral víc místa než sám rodokmen. Kdo je indikován
     ze STEJNÉHO důvodu, je proto v JEDNOM řádku: vlastní kritérium (stejná
     generace, stejný souhrn), nebo příbuzní téže zemřelé osoby. */
  var groups=[],byKey={},substRows=[],substByKey={};
  Object.keys(P).sort(function(a,b){return (gen[a]-gen[b])||(pos[a]-pos[b]);})
    .forEach(function(i){
      var r=indicatedFor(i);if(!r.length)return;
      /* příbuzní zemřelého bez vyšetření (C25/C56) — řádek podle zemřelého */
      r.forEach(function(x){
        if(!x.via||!x.via.length)return;
        var sk=x.via.slice().sort().join(',')+'|'+x.dg;
        if(!substByKey[sk]){substByKey[sk]={via:x.via,dg:x.dg,ids:[]};substRows.push(substByKey[sk]);}
        if(substByKey[sk].ids.indexOf(i)<0)substByKey[sk].ids.push(i);
      });
      r=r.filter(function(x){return !(x.via&&x.via.length);});
      if(!r.length)return;
      /* na list patří souhrn — jednotlivá kritéria jsou v postranním panelu */
      /* jisté (st 2) vs. možné (st 1 — chybí údaj, např. věk) zvlášť:
         „možná indikace“ se nesmí číst jako splněné kritérium */

         splnili — čtenář pak ví, proč tu indikace je, a dohledá ji v tabulce.
         Splňuje-li osoba stejnou dg. i individuálně (OA), stačí ta. */
      var dg=[],dg1=[],seen={},bySt={};
      r.forEach(function(x){
        var k=x.dg+(x.zdroj?' ['+x.zdroj+']':'')+'|'+x.st;
        if(!bySt[k]){bySt[k]={x:x,oa:false,ev:[]};}
        if(x.typ==='K'&&x.ra&&x.ra.length)bySt[k].ev=bySt[k].ev.concat(x.ra);
        else bySt[k].oa=true;});
      r.forEach(function(x){
        var base=x.dg+(x.zdroj?' ['+x.zdroj+']':''),b=bySt[base+'|'+x.st];
        if(seen[base+x.st])return;seen[base+x.st]=1;
        var lab=base+((b.oa||!b.ev.length)?'':' [OA + RA: '+raText(b.ev)+']');
        (x.st===2?dg:dg1).push({base:base,lab:lab});});
      dg=dg.map(function(o){return o.lab;});
      dg1=dg1.filter(function(o){return !dg.some(function(l){return l.indexOf(o.base)===0;});})
        .map(function(o){return o.lab;});
      var parts=[];
      if(dg.length)parts.push('splňuje '+dg.join('; '));
      if(dg1.length)parts.push('možná indikace (chybí údaj) — '+dg1.join('; '));
      if(!parts.length)return;
      var sum=parts.join(' · ');
      /* proband/konzultand má vždy vlastní řádek — o něm se rozhoduje */
      var solo=(P[i].proband||P[i].consultand)?('!'+i):'';
      var key=gen[i]+'|'+solo+'|'+sum;
      if(!byKey[key]){byKey[key]={sum:sum,g:gen[i],ids:[]};groups.push(byKey[key]);}

    var labs=ids.map(function(i){return P[i].label;}).filter(Boolean);
    /* označení vypisujeme, jen když je vyplněné a je jich rozumně málo;

    if(labs.length===ids.length&&labs.length<=8)return ' ('+labs.join(', ')+')';

/* Kdo je kdo v souhrnu pod rodokmenem: označení ze symbolu („II-1“), jinak
   vztah k probandovi („sestra otce probanda“) — interní číslo „#10“ čtenář

function kritName(id){
  var p=P[id];if(!p)return '?';
  if(p.label)return p.label;

/* příbuzní, kteří splnili RA část kombinovaného kritéria: „I-1 ca žaludku,
   I-2 ca prsu“ (nejvýš 4 osoby, pak „a další“) */
function raText(ev){
  var by={},order=[];
  ev.forEach(function(e){
    if(!by[e.id]){by[e.id]=[];order.push(e.id);}
    var n=e.t?tumName(e.t):'';
    if(n&&by[e.id].indexOf(n)<0)by[e.id].push(n);});
  var s=order.slice(0,4).map(function(i){
    return kritName(i)+(by[i].length?' '+by[i].join(' + '):'');}).join(', ');

  var s=gdSub(e),d=GDC[e.c];

  return nm+(GDSUF[e.st]||'')+(e.age?' '+e.age+' l.':'');
}
function gdShort(p){return gdList(p).map(gdShortOne).join(', ');}
/* do textu stejně jako nádor: „má Marfanův syndrom (FBN1, dg. v 32 letech)“ */
function gdPhrase(e,nom){
  var s=gdSub(e),parts=[];
  /* „hypermobilní (hEDS)“ → „hypermobilní, hEDS“ — závorka v závorce se nečte */
  if(s)parts.push(s.l.replace(/\s*\(([^)]*)\)/g,', $1'));
  if(plain(e.det||'').trim())parts.push(plain(e.det).trim());
  if(e.age)parts.push((e.st==='aff'?'dg. ':'zjištěno ')+vLet(e.age));
  var N=gdName(e);
  if(e.st==='pre')return 'presymptomatické nosičství ('+[N].concat(parts).join(', ')+')';
  if(e.st==='car')return 'heterozygotní nosičství ('+[N].concat(parts).join(', ')+')';
  if(e.st==='neg')return 'negativní vyšetření ('+[N].concat(parts).join(', ')+')';
  if(e.st==='het'||e.st==='hom'||e.st==='unk')
    return N+' ('+[GDST[e.st]].concat(parts).join(', ')+')';
  return (nom?N:gdAcc(e))+(parts.length?' ('+parts.join(', ')+')':'');
}
function gdAll(p,nom){return gdList(p).map(function(e){return gdPhrase(e,nom);}).join(', ');}
/* co se kreslí do symbolu: dědičnosti postižených / přenašečů, a zda nosič */
var GDORDER=['AD','AR','ADAR'];
function gdVis(p){
  var full={},car={},pre=false;
  gdList(p).forEach(function(e){
    var k=GDKIND[e.st];
    if(k==='full')full[gdMode(e)]=1;
    else if(k==='car')car[gdMode(e)==='AD'?'ADAR':gdMode(e)]=1;
    else if(k==='pre')pre=true;});
  function ord(o){return GDORDER.filter(function(m){return o[m];});}
  return {full:ord(full),car:ord(car),pre:pre};
}
var GDMODELAB={AD:'AD',AR:'AR',ADAR:'AD/AR'};

/* ------------------------------------------------------------------
   RIZIKO PRO PŘÍBUZNÉ 1. STUPNĚ — prostá mendelovská pravidla podle
   typu dědičnosti (GeneReviews, oddíl Genetic Counseling):
   AD (postižený / nosič)  děti 50 %; rodiče a sourozenci „v riziku“
                           (závisí na rodičích, u některých de novo)
   FV Leiden homozygot     děti obligátní nosiči
   AR postižený            rodiče a děti obligátní přenašeči; sourozenci 25 %
   AR přenašeč             sourozenci a děti přenašeči 50 %; rodiče: jeden
   AD/AR neurčeno          příbuzní 1. stupně „v riziku“
   Jako u nádorů: jen žijící, bez vlastního záznamu o tomtéž onemocnění
   (i negativní výsledek vyřazuje), a kdo je v riziku ze stejného důvodu,
   je v jednom řádku.
   ------------------------------------------------------------------ */
var GDRISK=[
  {k:'obl',l:'obligátní nosiči'},
  {k:'oblc',l:'obligátní přenašeči'},
  {k:'r50',l:'riziko 50 %'},
  {k:'r25',l:'riziko 25 %'},
  {k:'c50',l:'přenašeči 50 %'},
  {k:'onep',l:'jeden z rodičů přenašeč'},
  {k:'risk',l:'v riziku'}];
function gdRelOf(src,r){
  var bp=biolParentsOf(r);
  if(bp[0]==src||bp[1]==src)return 'kid';
  var sp=biolParentsOf(src);
  if(sp[0]==r||sp[1]==r)return 'par';
  if(kdegree(src,r)===1)return 'sib';
  return null;
}
function gdRiskCat(e,rel,src){
  var m=gdMode(e),k=GDKIND[e.st];
  if(k==='neg')return null;
  if(k==='car'){
    return rel==='par'?'onep':'c50';
  }
  if(m==='AD'){
    /* homozygot: obě alely od rodičů → rodiče i děti obligátní nosiči */
    if(e.st==='hom'&&rel!=='sib')return 'obl';
    if(rel==='kid')return 'r50';
    /* rodiče/sourozenci „v riziku“ jen když původ není znám — má-li to už
       některý z rodičů, sourozenci dostanou 50 % přímo od něj a druhý
       rodič riziko nenese */
    var sp=biolParentsOf(src);
    if([sp[0],sp[1]].some(function(q){return q&&P[q]&&gdPos(P[q]).some(function(x){
        return x.c===e.c;});}))return null;
    return 'risk';
  }
  if(m==='AR'){
    if(k==='pre')return 'risk';
    return rel==='sib'?'r25':'oblc';
  }
  return 'risk';
}
var GDRISKHEAD='RIZIKO PRO ŽIJÍCÍ PŘÍBUZNÉ 1. STUPNĚ — GENETICKÁ ONEMOCNĚNÍ (dle dědičnosti, GeneReviews)';
/* legenda k vzorům jen tehdy, když je v rodokmenu nějaké genetické onemocnění;
   zkratky se vysvětlí jen u těch, které jsou opravdu použité */
function gdLegend(){
  var used={},any=false;
  Object.keys(P).forEach(function(i){gdPos(P[i]).forEach(function(e){any=true;used[e.c]=1;});});
  if(!any)return '';
  var ab=GD.filter(function(d){return d.c&&used[d.c]&&d.s!==d.n&&
      ['MARFAN','FVL','JINE'].indexOf(d.c)<0;})
    .map(function(d){return d.s+' = '+d.n;});
  /* dělení řídí volba „Postižený / Jiná dg.“, ne nádor — legenda musí
     říkat totéž, co kreslí drawGdFill */
  return ' Genetická onemocnění: šrafy = AD, tečky = AR, mřížka = AD nebo AR (dle podtypu) · '+
    'pravá polovina vzoru = přenašeč AR, svislá čára = presymptomatický nosič · '+
    'u postižených levá polovina = postižen(a) (¼ = jiná dg.), pravá = genetika'+
    (ab.length?' · '+ab.join(', '):'')+'.';
}
function gdRiskLines(){
  var rows=[],byKey={};
  var ids=Object.keys(P).sort(function(a,b){return (gen[a]-gen[b])||(pos[a]-pos[b]);});
  ids.forEach(function(src){
    gdList(P[src]).forEach(function(e){
      if(e.st==='neg')return;
      /* jeden řádek na onemocnění — i když má každý v rodině jiný (nebo
         žádný) podtyp; typ dědičnosti se u řádku sloučí */
      var key=e.c+'|'+(e.c==='JINE'?gdName(e):'');
      if(!byKey[key]){byKey[key]={e:e,src:[],cat:{},modes:{}};rows.push(byKey[key]);}
      var row=byKey[key];if(row.src.indexOf(src)<0)row.src.push(src);row.modes[gdMode(e)]=1;
      ids.forEach(function(r){
        if(r==src)return;
        var q=P[r];if(!q||q.dead||q.special)return;
        if(gdList(q).some(function(x){return x.c===e.c&&(e.c!=='JINE'||gdName(x)===gdName(e));}))return;
        var rel=gdRelOf(src,r);if(!rel)return;
        var c=gdRiskCat(e,rel,src);if(!c)return;
        /* silnější kategorie vyhrává (pořadí v GDRISK) */
        var rank=function(x){for(var i=0;i<GDRISK.length;i++)if(GDRISK[i].k===x)return i;return 99;};
        if(row.cat[r]===undefined||rank(c)<rank(row.cat[r]))row.cat[r]=c;
      });
    });
  });
  function lab(i){return P[i].label||('#'+i);}
  var out=[];
  rows.forEach(function(row){
    var d=GDC[row.e.c];
    var nm=(row.e.c==='JINE')?gdName(row.e):(d?d.s:row.e.c);
    var segs=[];
    GDRISK.forEach(function(rk){
      var who=Object.keys(row.cat).filter(function(i){return row.cat[i]===rk.k;})
        .sort(function(a,b){return (gen[a]-gen[b])||(pos[a]-pos[b]);});
      if(!who.length)return;
      var labs=who.map(function(i){return P[i].label;}).filter(Boolean);
      segs.push(rk.l+': '+((labs.length===who.length&&labs.length<=8)?labs.join(', ')
        :czCount(who.length,'osoba','osoby','osob')));
    });
    if(!segs.length)return;
    var ms=Object.keys(row.modes);
    out.push(nm+' ('+GDMODELAB[ms.length===1?ms[0]:'ADAR']+'; '+row.src.map(lab).join(', ')+') — '+segs.join(' · '));
  });
  return out;
}

/* výchozí podoba záznamu osoby — jediné místo, které ji určuje (používá ji
   i validateCase při načítání souboru) */
function newPersonShape(id){
  return {id:id,sex:'U',aff:0,carrier:false,dead:false,proband:false,
    consultand:false,label:'',yob:'',yod:'',age:'',adead:'',cond:'',hist:'',special:'',
    adopt:'',tested:'',n:1,tum:[],gd:[],cause:'',pu:null,healthy:false,twin:[],
    sibsChecked:false};
}
function newPerson(o){o=o||{};var id=nextP++;
  P[id]=newPersonShape(id);P[id].sex=o.sex||'U';P[id].pu=o.pu||null;return P[id];}
function newUnion(a,b){var id=nextU++;
  U[id]={id:id,a:a,b:b,consang:false,term:false,nokids:'',kids:[],twin:''};
  return U[id];}
function unionsOf(id){var r=[];for(var k in U)if(U[k].a==id||U[k].b==id)r.push(U[k]);return r;}
function spouseOf(id){var u=unionsOf(id)[0];if(!u)return null;
  var s=(u.a==id?u.b:u.a);return s||null;}
function parentsOf(id){var u=P[id]&&P[id].pu;if(!u||!U[u])return [null,null];
  var a=U[u].a,b=U[u].b,f=null,m=null;
  [a,b].forEach(function(i){if(!i||!P[i])return;
    if(P[i].sex==='F'&&m===null)m=i;else if(f===null)f=i;else m=i;});
  if(f===null&&m!==null){f=null;}
  return [f,m];}
function sibsOf(id){var u=P[id]&&P[id].pu;if(!u||!U[u])return [];
  return U[u].kids.filter(function(k){return k!=id&&P[k];});}
/* half-siblings: share exactly one parent with `id`, through a different union */
function halfSibsOf(id){
  var pu=P[id]&&P[id].pu;if(!pu||!U[pu])return [];
  var mine=[U[pu].a,U[pu].b].filter(Boolean),out=[];
  for(var k in U){
    if(k==pu)continue;
    var here=[U[k].a,U[k].b].filter(Boolean);
    var shared=here.filter(function(x){return mine.indexOf(x)>-1;});
    if(shared.length===1)U[k].kids.forEach(function(c){
      if(P[c])out.push({id:c,via:shared[0]});});
  }
  return out;
}
function extraUnions(pid,excl){
  return unionsOf(pid).filter(function(u){return u.id!=excl;});}
/* dvojče je vlastnost KONKRÉTNÍ dvojice sourozenců, ne celého svazku — u
   3+ sourozenců tak jde přesně říct, kteří z nich patří do stejného
   vícečetného porodu. p.twin je pole VŠECH dvojic, do kterých osoba patří
   (u páru jedna položka, u trojčat dvě) — obě strany každé dvojice se
   zapisují i mažou zároveň. Typ (MZ/DZ) je zjednodušeně jednotný pro
   všechny dvojice jedné osoby najednou (smíšená zygozita u vícerčat je
   natolik vzácná, že by UI jen zbytečně zesložitila). */
function twinLinks(id){return (P[id]&&P[id].twin)||[];}
function twinPartnerIds(id){return twinLinks(id).map(function(t){return t.with;});}
function isTwinWith(a,b){return twinLinks(a).some(function(t){return t.with==b;});}
function addTwinLink(a,b,type){
  if(!P[a]||!P[b]||a==b)return;
  removeTwinLink(a,b);
  if(!P[a].twin)P[a].twin=[];
  if(!P[b].twin)P[b].twin=[];
  P[a].twin.push({with:+b,type:type});
  P[b].twin.push({with:+a,type:type});
}
function removeTwinLink(a,b){
  if(P[a]&&P[a].twin)P[a].twin=P[a].twin.filter(function(t){return t.with!=b;});
  if(P[b]&&P[b].twin)P[b].twin=P[b].twin.filter(function(t){return t.with!=a;});
}
function setTwinType(id,type){
  twinLinks(id).forEach(function(t){
    t.type=type;
    var back=twinLinks(t.with).filter(function(x){return x.with==+id;})[0];
    if(back)back.type=type;
  });
}
/* stará data: dvojče na celém svazku (nejstarší formát), nebo dvojče jako
   jediný pár {with,type} přímo na osobě (formát z dřívější verze v této
   relaci) — obojí se převede na aktuální pole, ať se otevřením staršího
   uloženého souboru dvojčata neztratí. Nejdřív se posbírají staré páry
   do prostého seznamu a TEPRVE PAK se všechna p.twin narovnají na pole —
   jinak by addTwinLink/removeTwinLink sáhly na .filter u objektu, který
   ještě není pole. */
function migrateTwins(){
  var pending=[];
  Object.keys(P).forEach(function(id){
    var t=P[id].twin;
    if(t&&!Array.isArray(t)&&t.with)pending.push({a:+id,b:+t.with,type:t.type||'DZ'});
  });
  Object.keys(P).forEach(function(id){if(!Array.isArray(P[id].twin))P[id].twin=[];});
  pending.forEach(function(pr){if(P[pr.a]&&P[pr.b])addTwinLink(pr.a,pr.b,pr.type);});
  for(var k in U){
    var u=U[k];
    if(!u.twin)continue;
    var ks=u.kids.filter(function(i){return P[i];});
    if(ks.length>1&&!twinLinks(ks[0]).length&&!twinLinks(ks[1]).length)
      addTwinLink(ks[0],ks[1],u.twin);
    u.twin='';
  }
}
function kidsOf(id){var r=[];unionsOf(id).forEach(function(u){
  u.kids.forEach(function(k){if(P[k])r.push(k);});});return r;}
function theProband(){for(var k in P)if(P[k].proband)return P[k];
  for(var j in P)return P[j];return null;}

/* ---- dates: fill in whatever can be worked out from what was typed ---- */
var NOWY=new Date().getFullYear();
/* Číslo z pole roku/věku. Dřív se ze vstupu prostě vyhodily všechny
   nečíslice: „45–50“ → 4550, „4,5“ → 45 — a věkové kritérium pak tiše
   neplatilo (audit 5.10., D3). Teď: právě JEDNO číslo (i s textem okolo,
   „cca 50“, „r. 1954“, „45 l.“), desetinné se zaokrouhlí dolů („4,5“ → 4);
   rozsah nebo víc čísel = nečitelné → null (pole se v panelu zčervená). */
function num(v){
  var m=String(v==null?'':v).match(/\d+(?:[.,]\d+)?/g);
  if(!m||m.length!==1)return null;
  return Math.floor(parseFloat(m[0].replace(',','.')));
}
/* vyplněno, ale nedá se přečíst jako jedno číslo */
function numBad(v){return String(v==null?'':v).trim()!==''&&num(v)===null;}
/* desetinné číslo (PSA apod. bývá "22.5") — num() by tečku vyhodilo pryč */
function numF(v){if(v===''||v==null)return null;var f=parseFloat(String(v).replace(',','.'));return isNaN(f)?null:f;}
/* Dates. Numbers you type are yours and are never overwritten. Numbers the tool
   works out are marked "auto" — those are the only ones it may change or clear.
   Clearing any box drops every auto value and does NOT refill, so a mistake can
   always be fully deleted. */
function auOf(p){if(!p.au)p.au={};return p.au;}
function yearOK(y){return y!==null&&y>=1800&&y<=NOWY+1;}
function ageOK(a){return a!==null&&a>=0&&a<=125;}
function put(p,f,v,ok){
  if(v===null||isNaN(v)||!ok(v))return;
  var au=auOf(p);
  if(String(p[f]||'').trim()===''||au[f]){p[f]=String(v);au[f]=true;}
}
function fill(p){
  var au=auOf(p);
  /* dopočtené hodnoty zahodíme a počítáme znovu jen z ručně zadaných —
     jinak by zůstal viset mezivýsledek z rozepsaného čísla */
  ['yob','yod','age','adead'].forEach(function(k){
    if(au[k]){p[k]='';au[k]=false;}});
  var yb=num(p.yob),yd=num(p.yod),ag=num(p.age),ad=num(p.adead);
  if(!yearOK(yb)&&ageOK(ag)&&yd===null&&ad===null){
    put(p,'yob',NOWY-ag,yearOK);yb=num(p.yob);}
  if(!yearOK(yb)&&yearOK(yd)&&ageOK(ad)){
    put(p,'yob',yd-ad,yearOK);yb=num(p.yob);}
  if(yearOK(yb)&&yearOK(yd))put(p,'adead',yd-yb,ageOK);
  else if(yearOK(yb)&&ageOK(ad))put(p,'yod',yb+ad,yearOK);
  if(yearOK(yb)&&!p.dead)put(p,'age',NOWY-yb,ageOK);
  if((num(p.yod)!==null||num(p.adead)!==null)&&!p.dead){p.dead=true;au.dead=true;}
}
/* called on every keystroke in one of the four date boxes */
function setDate(p,f,val){
  var au=auOf(p);
  p[f]=val;au[f]=false;
  if(!String(val).trim()){
    ['yob','yod','age','adead'].forEach(function(k){
      if(au[k]){p[k]='';au[k]=false;}});
    if(au.dead&&num(p.yod)===null&&num(p.adead)===null){p.dead=false;au.dead=false;}
    return;                      /* cleared stays cleared */
  }
  fill(p);
}
/* turning "zemřel(a)" off clears the death fields rather than leaving them stranded */
/* U zemřelého je všechno „v anamnéze“ — okénko OA se mu nenabízí. Co v OA
   zůstalo (osoba označená jako zemřelá později, starší uložený soubor),
   se přesune do „V anamnéze“, ať se nic neschová. */
function joinList(a,b){return [String(a||'').trim(),String(b||'').trim()].filter(Boolean).join(', ');}
function deadToHist(p){
  if(p&&p.dead&&String(p.cond||'').trim()){p.hist=joinList(p.cond,p.hist);p.cond='';}
}
function setDead(p,v){
  var au=auOf(p);p.dead=v;au.dead=false;
  if(v)deadToHist(p);
  if(!v){['yod','adead'].forEach(function(k){p[k]='';au[k]=false;});fill(p);}
  else fill(p);
}
/* what shows under the symbol: birth year for the living, age at death for the dead */
function dateLine(p){
  if(p.dead)return p.adead?'† '+p.adead+' l.':(p.yod?'† '+p.yod:'† neví');
  if(p.yob)return 'r. '+p.yob;
  if(p.age)return p.age+' l.';
  return '';
}

/* ===================== undo / redo ===================== */
/* redrawKeep po každém úhozu znovu zaměří pole (PROGRAMMATIC_FOCUS) — to
   není nová akce uživatele; bez této pojistky by každé písmeno bylo krokem
   Zpět a ze 60 kroků historie by vypadlo to, co chce uživatel vrátit */
/* Stav pro Zpět/Znovu: model + hlavička listu + dvě zaškrtnutí „aktivně
   zjišťováno“ — dřív jen model, takže změna hlavičky nebo zaškrtnutí nešla
   vrátit (audit 5.10., D5). */
function stateJSON(){
  var s={};
  if(typeof IDF!=='undefined')IDF.forEach(function(i){var e=document.getElementById(i);if(e)s[i]=e.value;});
  return JSON.stringify({P:P,U:U,nextP:nextP,nextU:nextU,sel:sel,sheet:s,
    cc:CONSANG_CHECKED,of:OTHERFACTS_CHECKED});
}
function restoreState(d){
  P=d.P;U=d.U;nextP=d.nextP;nextU=d.nextU;
  sel=(d.sel&&P[d.sel])?d.sel:null;
  /* u dvou stran je hlavička společná — Zpět jedné strany ji nesmí vrátit (audit 8.10., R2) */
  if(d.sheet&&!SIDES)Object.keys(d.sheet).forEach(function(i){
    var e=document.getElementById(i);if(e)e.value=d.sheet[i];});
  if(d.cc!==undefined)CONSANG_CHECKED=d.cc;
  if(d.of!==undefined)OTHERFACTS_CHECKED=d.of;
}
function snap(){if(PROGRAMMATIC_FOCUS)return;hist.push(stateJSON());
  if(hist.length>60)hist.shift();
  DIRTY=true;    /* uživatel něco mění — od teď smí autosave přepsat zálohu */
  UNSAVED=true;
  redoHist=[];   /* a fresh action invalidates whatever could have been redone */}
function undo(){if(!hist.length)return;
  redoHist.push(stateJSON());
  if(redoHist.length>60)redoHist.shift();
  restoreState(JSON.parse(hist.pop()));DIRTY=true;draw();}
function redo(){if(!redoHist.length)return;
  hist.push(stateJSON());
  if(hist.length>60)hist.shift();
  restoreState(JSON.parse(redoHist.pop()));DIRTY=true;draw();}

/* ===================== generations ===================== */
var gen={};
function computeGens(){
  gen={};var ids=Object.keys(P).map(Number);if(!ids.length)return;
  var root=theProband();gen[root.id]=0;
  for(var it=0;it<ids.length+6;it++){
    var ch=false;
    ids.forEach(function(i){
      if(gen[i]===undefined)return;
      var g=gen[i];
      var pp=P[i].pu&&U[P[i].pu];
      if(pp){[pp.a,pp.b].forEach(function(p){
        if(p&&P[p]&&gen[p]!==g-1){gen[p]=g-1;ch=true;}});}
      unionsOf(i).forEach(function(u){
        var sp=(u.a==i?u.b:u.a);
        if(sp&&P[sp]&&gen[sp]!==g){gen[sp]=g;ch=true;}

/* spojnice od příčky dolů ke každému dítěti v řádku, včetně seskupení

       vidět podle společného vrcholu apex */
    if(g.length===2&&twinLinks(g[0]).some(function(t){return t.with==g[1]&&t.type==='MZ';})){
      /* konce čárky leží přesně na šikmých čarách (stejný podíl t pro x i y) */
      var a=xp(g[0]),b=xp(g[1]),t=0.55,my=bar+(ky-SY-bar)*t;

function drawUnion(svg,u){

      svg.appendChild(E('path',{'class':'conn',d:'M'+x1+' '+(y+3)+'H'+x2}));
    } else svg.appendChild(E('path',{'class':'conn',d:'M'+x1+' '+y+'H'+x2}));
    if(u.term){
      svg.appendChild(E('path',{'class':'conn',d:'M'+(mx-9)+' '+(y+9)+'L'+(mx-1)+' '+(y-9)}));
      svg.appendChild(E('path',{'class':'conn',d:'M'+(mx+1)+' '+(y+9)+'L'+(mx+9)+' '+(y-9)}));
    }

      svg.appendChild(E('path',{'class':'conn',d:'M'+(mx-13)+' '+(y+24)+'H'+(mx+13)}));
      if(u.nokids==='inf')svg.appendChild(E('path',{'class':'conn',
        d:'M'+(mx-13)+' '+(y+30)+'H'+(mx+13)}));
    }

  }

  var kx=attachXs(kids);

  /* příčka nevlastních sourozenců je výš, aby se nepletla s plnými — ale jen
     když tu opravdu nějaká plná hrozí (rodič má i druhý svazek). Vlastní
     děti bez udaného partnera (běžný "Potomek" bez "Partnera") žádnou
     sousední příčku nemají, takže vypadají jako obyčejná rodičovská čára. */
  var bar=ky-SY-barLevelFor(uid);

  var dd=unionDropX(uid), dx=dd?dd.dx:mx;
  svg.appendChild(E('path',{'class':'conn',d:'M'+dx+' '+y+'V'+bar}));
  lo=Math.min(lo,dx);hi=Math.max(hi,dx);
  if(hi>lo)svg.appendChild(E('path',{'class':'conn',d:'M'+lo+' '+bar+'H'+hi}));
  drawKidDrops(svg,kids,bar,ky);
}

/* Na kterou stranu symbolu patří "P": normálně na tu, kterou nezabírá text
   o nemoci — ale nikdy ne na stranu, kudy vede svatební čára k partnerovi
   (písmeno by pak bylo přeškrtnuté čárou). Je-li partner na téže straně jako
   by šlo "P", dá se na opačnou; kolidovalo by to s textem jen tehdy, kdyby
   text zabíral právě tu stranu — pak zůstává původní pravidlo. */
function probandSide(p){
  var base=(sideOf(p.id)==='R')?'L':'R';
  var sp=spouseOf(p.id);
  if(sp&&P[sp]&&gen[sp]==gen[p.id]){
    var away=(pos[sp]>pos[p.id])?'L':'R';
    if(away!==sideOf(p.id))return away;
    /* Obě strany obsazené: na jedné straně je popis, na druhé vede svatební
       čára. Dřív se v takovém případě „P“ postavilo stejně na stranu
       partnera — a svatební čára ho přeškrtla. Patří proto nad symbol,
       k jeho levému hornímu rohu: tam nevede svatební čára (ta je přesně
       v úrovni řady), ani svislice od rodičů (ta přichází ve středu). */
    return 'U';
  }
  return base;

/* obrys symbolu jako jedna cesta — pro ořez vzoru i pro obtažení navrch */
function symPath(p,x,y,S){
  if(p.sex==='M')return 'M'+(x-S)+' '+(y-S)+'H'+(x+S)+'V'+(y+S)+'H'+(x-S)+'Z';
  if(p.sex==='F')return 'M'+(x-S)+' '+y+'A'+S+' '+S+' 0 1 0 '+(x+S)+' '+y+
    'A'+S+' '+S+' 0 1 0 '+(x-S)+' '+y+'Z';
  return 'M'+x+' '+(y-S)+'L'+(x+S)+' '+y+'L'+x+' '+(y+S)+'L'+(x-S)+' '+y+'Z';
}
/* Symbol s genetickým onemocněním (jen černobílé vzory — tiskárna je ČB):
   šrafy = AD, tečky = AR, mřížka = AD i AR (dle podtypu/genu).
   • postižený / nosič AD: vzor přes celou plochu pro genetiku
   • přenašeč AR: vzor jen v pravé polovině (NSGC 2022 — rozdělený symbol
     místo tečky); kreslí se, jen když není žádné „plné“ postižení
   • presymptomatický nosič: svislá čára přes symbol (NSGC 2022)
   • má-li osoba zároveň nádor (postižený = levá polovina černá, „jiná dg.“
     = levá horní čtvrtina černá), patří genetice pravá polovina
   • víc typů dědičnosti naráz: plocha se svisle rozdělí, pořadí AD, AR, AD/AR */
function drawGdFill(g,p,x,y,S,gv,cls){
  var cid='gdc'+p.id,clip='url(#'+cid+')';

  g.appendChild(cp);
  function box(x0,y0,x1,y1,fill){
    g.appendChild(E('rect',{x:x0,y:y0,width:x1-x0,height:y1-y0,fill:fill,stroke:'none','clip-path':clip}));}
  function ln(x0,y0,x1,y1,w){

  if(p.aff===1){box(x-S,y-S,x,y+S,'#000');split=true;}
  else if(p.aff===2){box(x-S,y-S,x,y,'#000');split=true;}

    else x0=x;                               /* pravá polovina */

    var w=(x+S-x0)/modes.length;
    modes.forEach(function(m,i){box(x0+i*w,y0,x0+(i+1)*w,y+S,'url(#gp'+m+')');});
    for(var i=1;i<modes.length;i++)ln(x0+i*w,y0,x0+i*w,y+S,1.2);
    if(x0===x)ln(x,y-S,x,y+S,1.2);

/* presymptomatický nosič: svislá čára PŘES symbol (NSGC) — přesahuje ho

/* vzory výplně — jednou na kresbu, zdědí je i export SVG/PNG (klon kresby) */

function drawPerson(svg,p){
  var g=E('g',{'data-id':p.id});

     gravidita — se nevzorují) */
  var gv=p.special?{full:[],car:[],pre:false}:gdVis(p);
  var hasPat=!!(gv.full.length||gv.car.length);
  var cls='sym'+(p.aff===1&&!hasPat?' aff':'')+(sel==p.id?' sel':'');
  if(p.special==='SAB'||p.special==='TOP'){
    var t=S*0.62;
    g.appendChild(E('path',{'class':cls,d:'M'+x+' '+(y-t)+'L'+(x+t)+' '+(y+t)+'H'+(x-t)+'Z'}));
    if(p.special==='TOP')g.appendChild(E('path',{'class':'conn',

  } else if(p.special==='PREG'){
    g.appendChild(E('path',{'class':cls,

    g.appendChild(E('text',{x:x,y:y+5,'class':'idl','text-anchor':'middle'},'P'));
  } else if(p.sex==='M'){

  } else if(p.sex==='F'){
    g.appendChild(E('circle',{'class':cls,cx:x,cy:y,r:S}));
  } else {
    g.appendChild(E('path',{'class':cls,
      d:'M'+x+' '+(y-S)+'L'+(x+S)+' '+y+'L'+x+' '+(y+S)+'L'+(x-S)+' '+y+'Z'}));
  }
  if(hasPat)drawGdFill(g,p,x,y,S,gv,cls);
  else if(p.aff===2){
    if(p.sex==='M')g.appendChild(E('rect',{x:x-S,y:y-S,width:S,height:2*S,
      fill:'#000',stroke:'none'}));
    else g.appendChild(E('path',{d:'M'+x+' '+(y-S)+'A'+S+' '+S+' 0 0 0 '+x+' '+(y+S)+'Z',
      fill:'#000',stroke:'none'}));
  }
  /* presymptomatický nosič bez vzoru — na černém symbolu bílá čára */
  if(!hasPat&&gv.pre)drawPreLine(g,x,y,S,p.aff===1);
  if(p.carrier)g.appendChild(E('circle',{cx:x,cy:y,r:S*0.28,fill:'#000',stroke:'none'}));
  if(p.dead)g.appendChild(E('path',{'class':'conn',
    d:'M'+(x-S-7)+' '+(y+S+7)+'L'+(x+S+7)+' '+(y-S-7)}));
  if(p.adopt){
    g.appendChild(E('path',{'class':'conn',d:'M'+(x-S-7)+' '+(y-S-5)+'h-6v'+(2*S+10)+'h6'}));
    g.appendChild(E('path',{'class':'conn',d:'M'+(x+S+7)+' '+(y-S-5)+'h6v'+(2*S+10)+'h-6'}));
  }
  if(p.n>1)g.appendChild(E('text',hasPat
    ?{x:x,y:y+5,'class':'idl','text-anchor':'middle',fill:'#000',stroke:'#fff',
      'stroke-width':3,'paint-order':'stroke'}
    :{x:x,y:y+5,'class':'idl','text-anchor':'middle',fill:p.aff===1?'#fff':'#000'},p.n));
  if(p.proband){
    /* P sits beside the symbol on whichever side the condition text is NOT
       using, so a long write-up never types over it */
    var pside=probandSide(p);
    if(pside==='U')
      g.appendChild(E('text',{x:x-S-4,y:y-S-4,'class':'prb','text-anchor':'end'},'P'));
    else if(pside==='L')
      g.appendChild(E('text',{x:x-S-7,y:y+S-1,'class':'prb','text-anchor':'end'},'P'));
    else
      g.appendChild(E('text',{x:x+S+7,y:y+S-1,'class':'prb'},'P'));
  }
  if(p.consultand){
    /* arrow sits high beside the symbol so it never runs into the text below.
       Když je osoba zároveň proband, sedí "P" na téže straně, kam by šipka
       normálně šla — otočíme ji pak na druhou stranu, ať se "P" nepřekrývá
       se šipkou a je vidět obojí označení. */
    /* Stojí-li partner VLEVO (typicky matka se šipkou), vede zleva svatební
       čára — šipka by ležela přímo na ní (8.10., strana „rod matky“).
       Pak jde šipka doprava. U probanda platí dál pravidlo podle „P“. */
    var spA=spouseOf(p.id),spLeft=!!(spA&&P[spA]&&gen[spA]==gen[p.id]&&pos[spA]<pos[p.id]);
    var arrowR=p.proband?probandSide(p)==='L':spLeft;
    if(arrowR){
      g.appendChild(E('path',{'class':'conn',
        d:'M'+(x+S+23)+' '+(y-2)+'L'+(x+S+5)+' '+(y+S-6)}));
      g.appendChild(E('path',{'class':'conn',
        d:'M'+(x+S+5)+' '+(y+S-6)+'l9 0 -3-8Z',fill:'#000'}));
    } else {
      g.appendChild(E('path',{'class':'conn',
        d:'M'+(x-S-23)+' '+(y-2)+'L'+(x-S-5)+' '+(y+S-6)}));
      g.appendChild(E('path',{'class':'conn',
        d:'M'+(x-S-5)+' '+(y+S-6)+'l-9 0 3-8Z',fill:'#000'}));
    }
  }
  /* Popis pod symbolem. Odstup 20 (dřív 15) nechá mezi spodní hranou symbolu
     a horním okrajem písmen volný pruh ~7 jednotek — tudy vede vodorovné
     uhnutí svislice u rodiče bez partnera (JOGDY v drawUnion), které dřív
     procházelo rovnou přes hlavičku. */
  var ty=y+S+20;
  /* u osoby s vlastní svislicí k dětem sedí text celý vedle čáry */
  var ua=underTextAnchor(p.id);
  headLines(p).forEach(function(l){
    g.appendChild(E('text',{x:ua.x,y:ty,'class':'idl','text-anchor':ua.anc},l));
    ty+=13;});
  var sd=sideOf(p.id);
  var segL=wrapSegs(p,mcOf(p.id),capOf(p.id));
  var over=overflowed(p,mcOf(p.id),capOf(p.id));
  var tx0=ua.x,anc=ua.anc;
  if(sd){                       /* vedle symbolu, svisle na střed */
    tx0=(sd==='R')?(x+S+7):(x-S-7);
    anc=(sd==='R')?'start':'end';
    ty=y-((segL.length-1)*13)/2+4;
  }
  segL.forEach(function(l,li){
    var tx=E('text',{x:tx0,y:ty,'class':'cnd','text-anchor':anc});
    l.forEach(function(sg){
      var ts=E('tspan',sg.b?{'font-weight':'700'}:{});
      ts.textContent=sg.w;tx.appendChild(ts);});
    if(over&&li===segL.length-1){
      var mk=E('tspan',{'class':'key'});mk.textContent=' ↓';tx.appendChild(mk);}
    g.appendChild(tx);ty+=13;});
  if(over&&!segL.length)
    g.appendChild(E('text',{x:ua.x,y:ty,'class':'key','text-anchor':ua.anc},'↓ pozn.'));
  g.appendChild(E('rect',{'class':'hit',x:x-S-9,y:y-S-9,width:2*S+18,height:2*S+18}));
  g.addEventListener('click',function(){sel=p.id;draw();});
  svg.appendChild(g);
}

/* Legenda je pro nás jako připomínka, ne výklad — jen to, co v rodokmenu

function legendText(){

  var st=[];

  if(has.aff2)st.push('½ = jiná dg.');
  if(has.car)st.push('tečka uprostřed = přenašeč');
  if(has.dead)st.push('/ = zemřel(a)');
  if(has.Z)st.push('Z = zdráv(a)');
  if(st.length)g.push(st.join(', '));
  var mk=['P = proband'+(has.cons?', šipka = konzultand':'')];
  if(has.star||has.star2)mk.push((has.star?'* = indikován(a)':'')+
    (has.star&&has.star2?', ':'')+(has.star2?'*? = možná indikován(a) (chybí údaj)':'')+
    ' (SLG ČLS JEP)');
  if(has.test)mk.push('E+ / +/− / −/− = výsledek');

  var rel=[];

  /* verze aplikace na každém výtisku — ať jde dohledat, co ho vytvořilo (CLINICAL-SAFETY.md, H8) */
  return 'Legenda: '+g.join(' · ')+'.'+gdLegend()+' · Rodokmen '+APPVER;

/* Jediné escapování pro VŠECHNY kontexty HTML (text, hodnota atributu,
   obsah <textarea>): & < > " '. Dřív at() escapovalo jen uvozovky — text
   onemocnění „</textarea><img onerror=…>“ z cizího .json se pak v panelu
   provedl jako HTML (audit 5.10., S2) a „&lt;“ v textu se tiše měnilo na „<“. */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ===================== print mode ===================== */
/* Rodokmen se tiskne vždy na šířku (A4 landscape) — žádný přepínač na výšku,
   ať se to nedá omylem přepnout do módu, který se stejně nikdy nepoužije. */
function printCSS(){
  var el=document.getElementById('printmode');
  if(!el){el=document.createElement('style');el.id='printmode';
    document.head.appendChild(el);}
  el.textContent='@page{size:A4 landscape;margin:7mm}'+
     '@media print{'+
     '#sheet{width:auto!important;min-height:0;box-shadow:none;padding:0;'+
       'display:block;transform:none!important}'+
     '#sheetwrap{width:auto!important;height:auto!important;position:static}'+
     '}'+
     /* obě strany (rod matky + rod otce) = samostatné stránky za sebou */
     '#printBoth{display:none}'+
     '@media print{'+
     'body.both #app{display:none!important}'+
     'body.both #printBoth{display:block}'+
     '#printBoth>*{page-break-after:always;break-after:page}'+
     '#printBoth>*:last-child{page-break-after:auto;break-after:auto}'+
     '#printBoth .ptile{padding-top:4mm}'+
     '#printBoth .phead{font:9pt/1.3 "Segoe UI",Arial,sans-serif;color:#1F3864;margin:0 0 2mm}'+
     '}';
  /* Moc široký strom (viz PEDWIDE): tisk po skutečné velikosti přes víc
     stran s přesahem k slepení — jako u plakátového tisku — místo zmenšení
     na jednu stranu, které by zase udělalo písmo nečitelné. */
  if(PEDWIDE)el.textContent+=
    '#printTiles{display:none}'+
    '@media print{'+
    'body.tiled #app{display:none!important}'+
    'body.tiled #printTiles{display:block}'+
    '.ptile{page-break-after:always;padding-top:4mm}'+
    '.ptile:last-child{page-break-after:auto}'+
    '.phead{font:9pt/1.3 "Segoe UI",Arial,sans-serif;color:#1F3864;margin:0 0 2mm}'+
    '}';
}
/* ===================== tiskové dláždice (moc široký strom) ===================== */
/* Skutečná velikost, ne "přizpůsobit stránce": strom se rozdělí na svislé
   pruhy o šířce jedné stránky s přesahem PTILEOVERLAP mm, ať jde
   sousední strany po vytištění slepit ke čtení jako jeden dlouhý pás —
   stejný princip jako plakátový tisk nebo "Page Setup" ve specializovaných
   genogramových programech (GenoPro apod.). Vrací počet stran (0 = netiskne
   se dláždicově, strom se vejde normálně na jednu). */
var PTILEOVERLAP=20;
/* Kopie kresby do tiskové stránky: vzory a ořezy genetických onemocnění
   dostanou vlastní id a odkazy url(#…) se na ně přesměrují — originál je
   při tisku skrytý a duplicitní id by se pletla. Jedno místo pro dláždice
   i pro tisk obou stran (audit #2, M10). */
function suffixSvgIds(root,sfx){
  Array.prototype.forEach.call(root.querySelectorAll('[id]'),function(el){el.id+=sfx;});
  Array.prototype.forEach.call(root.querySelectorAll('[fill^="url(#"],[clip-path]'),function(el){
    ['fill','clip-path'].forEach(function(a){var v=el.getAttribute(a);
      if(v&&v.indexOf('url(#')===0)el.setAttribute(a,v.replace(/\)$/,sfx+')'));});});
}
function buildPrintTiles(pre){
  var old=document.getElementById('printTiles');
  if(old)old.remove();
  if(!PEDWIDE)return 0;
  var sliceVWFull=BOXW/PEDSCALE;
  var span=VW-sliceVWFull;         /* vždy > 0, dokud je PEDWIDE pravda */
  var step=Math.max(1,sliceVWFull-PTILEOVERLAP/PEDSCALE);
  /* kolik stran navíc (k) je potřeba — pod pár mm zbytku se další strana
     nevyplácí (byla by skoro totožná s tou předchozí); jakmile je k>=1,
     zbylé strany se rozloží ROVNOMĚRNĚ přes celý zbytek `span`, aby přesah
     nebyl nahodile jen na jednom švu a poslední strana vždy přesně
     domykala na VW — ne "co se vejde, plus zbytek useknout" */
  var tolVW=15/PEDSCALE;
  var k=Math.max(0,Math.ceil((span-tolVW)/step));
  if(k<1)return 0;   /* přebytek je zanedbatelný, vytiskne se normálně na jednu stranu */
  var n=k+1;
  var evenStep=span/k;
  var xs=[];
  for(var i=0;i<n;i++)xs.push(i*evenStep);
  var srcSvg=document.getElementById('ped');
  if(!srcSvg)return 0;
  var idVals={};
  IDF.forEach(function(k){var e=document.getElementById(k);idVals[k]=e?e.value:'';});
  var host=document.createElement('div');
  host.id='printTiles';
  for(var i=0;i<n;i++){
    var xStart=xs[i];
    var page=document.createElement('div');
    page.className='ptile';
    var head=document.createElement('div');
    head.className='phead';
    head.innerHTML='<b>RODOKMEN</b> — '+esc(idVals.idName||'')+
      (idVals.idRc?' · '+esc(idVals.idRc):'')+
      (idVals.idDate?' · '+esc(idVals.idDate):'')+
      ' — strana '+(i+1)+' z '+n+
      ' <i>(přesah '+PTILEOVERLAP+' mm se sousední stranou — slepte podle '+
      'shodného obsahu)</i>';
    page.appendChild(head);
    var clone=srcSvg.cloneNode(true);
    clone.removeAttribute('style');
    var hits=clone.querySelectorAll('.hit');
    for(var h=hits.length-1;h>=0;h--)hits[h].parentNode.removeChild(hits[h]);
    /* vzory a ořezy genetických onemocnění: každá dlaždice vlastní id —
       originál (#app) je při tisku skrytý a odkaz url(#…) do skrytého SVG
       se nevykreslí; duplicitní id navíc nejsou platná */
    suffixSvgIds(clone,(pre||'')+'_t'+i);
    clone.setAttribute('viewBox',xStart+' 0 '+sliceVWFull+' '+VH);
    clone.setAttribute('preserveAspectRatio','xMinYMin meet');
    clone.style.width=(sliceVWFull*PEDSCALE).toFixed(2)+'mm';
    clone.style.height='auto';
    clone.style.display='block';
    page.appendChild(clone);
    if(i===n-1){
      var notes=document.getElementById('notes');
      if(notes)page.appendChild(notes.cloneNode(true));
    }
    host.appendChild(page);
  }
  document.body.appendChild(host);
  return n;
}

/* kolik obrazovkových bodů je milimetr — měřeno, ne odhadnuto ze šířky listu
   (ta se u moc širokého stromu roztahuje, viz PEDWIDE) */
var _mmpx=null;
function mmpx(){
  if(_mmpx)return _mmpx;
  var d=document.createElement('div');
  d.style.cssText='position:absolute;left:-9999px;top:0;width:100mm;height:0';
  document.body.appendChild(d);
  _mmpx=d.offsetWidth/100;
  if(d.parentNode)d.parentNode.removeChild(d);
  if(!(_mmpx>0))_mmpx=null;
  return _mmpx||3.78;
}
/* dá kresbě veškerou výšku i šířku, která na stránce zbyde po hlavičce a
   poznámkách — obojí v mm, aby to platilo i při tisku */
function fitDrawing(){
  var sh=document.getElementById('sheet'),ped=document.getElementById('ped'),
      ib=document.getElementById('idbar'),nt=document.getElementById('notes'),
      dw2=document.getElementById('drawwrap');
  if(!sh||!ped||!sh.offsetWidth)return;
  var pxmm=mmpx();
  /* A4 na šířku 210 mm − 2× okraj 7 mm (@page v printCSS) = 196 mm. Od toho
     skutečné výšky hlavičky a poznámek VČETNĚ jejich vnějších okrajů
     (offsetHeight je nezahrnuje) a 1 mm rezervy na zaokrouhlení — dřív tu
     bylo 194 a paušálních −3 mm, takže dole na listu zbýval pruh prázdna. */
  function mg(el,side){if(!el)return 0;
    return parseFloat(getComputedStyle(el)['margin'+side])||0;}
  var usedPx=(ib?ib.offsetHeight+mg(ib,'Top')+mg(ib,'Bottom'):0)+
             (nt?nt.offsetHeight+mg(nt,'Top')+mg(nt,'Bottom'):0);
  var availMm=196-usedPx/pxmm-1;
  if(availMm>50)ped.style.maxHeight=availMm.toFixed(1)+'mm';
  var want=Math.max(80,Math.min(188,availMm));
  /* skutečná využitelná šířka listu (list mínus okraje) — do ní se počítá
     měřítko, takže se nesmí jen odhadovat */
  var wMm=BOXW;
  if(!PEDWIDE&&dw2&&dw2.clientWidth)wMm=dw2.clientWidth/pxmm;
  if(!(wMm>120))wMm=BOXW;
  if((Math.abs(want-AVAILH)>4||Math.abs(wMm-BOXW)>1)&&!FITTING){
    FITTING=true;AVAILH=want;BOXW=wMm;   /* jeden dopočet navíc */
    try{draw();}finally{FITTING=false;}  /* i při chybě — jinak by se už nikdy nepřepočítalo */
  }
}

var KRIT=true;   /* zobrazovat indikační kritéria */
var ZOOM=null;   /* null = fit to width */
function applyZoom(){
  var sh=document.getElementById('sheet'),wr=document.getElementById('sheetwrap'),
      st=document.getElementById('stage');
  if(!sh||!wr||!st)return;
  var pageW=sh.offsetWidth||1123, avail=(st.clientWidth||1000)-36;
  var k=(ZOOM===null)?Math.min(1,avail/pageW):ZOOM;
  if(!(k>0.15))k=0.15;
  sh.style.transform='scale('+k+')';
  wr.style.width=Math.round(pageW*k)+'px';
  wr.style.height=Math.round((sh.offsetHeight||794)*k)+'px';
  var z=document.getElementById('zLab');
  if(z)z.textContent=Math.round(k*100)+'%';
}

var SECOPEN={};

/* Hláška v liště pod panelem nástrojů. kind: 'info' | 'warn' | 'err';
   btns: [{t:'Text',f:funkce}] — po kliknutí se lišta zavře. Informace bez
   tlačítek zmizí sama, chyby zůstávají, dokud je uživatel nezavře. */
var MSGTIMER=null;
function notify(text,kind,btns){
  var bar=document.getElementById('msgbar');
  if(!bar){if(window.console)console.warn(text);return;}
  /* nabídka obnovy zálohy nesmí zmizet pod jinou hláškou — jinak by záloha
     zůstala navždy zablokovaná; další text se jen připojí */
  if(typeof RESTORE_PENDING!=='undefined'&&RESTORE_PENDING&&!bar.hidden&&!(btns&&btns.length)){
    var add=document.createElement('span');add.textContent=' · '+text;
    bar.insertBefore(add,bar.querySelector('button'));return;}
  if(MSGTIMER){clearTimeout(MSGTIMER);MSGTIMER=null;}
  bar.className=kind||'warn';bar.hidden=false;bar.textContent='';
  var t=document.createElement('span');t.className='msgt';t.textContent=text;bar.appendChild(t);
  (btns||[]).forEach(function(b){
    var el=document.createElement('button');el.textContent=b.t;
    el.onclick=function(){bar.hidden=true;b.f();};bar.appendChild(el);});
  var x=document.createElement('button');x.textContent='×';x.title='Zavřít';
  x.onclick=function(){bar.hidden=true;};
  if(!(btns&&btns.length))bar.appendChild(x);
  if((kind||'warn')==='info'&&!(btns&&btns.length))
    MSGTIMER=setTimeout(function(){bar.hidden=true;},7000);
}

/* ano/ne/nezjištěno pro vlastnosti, které motor kritérií opravdu vyhodnocuje
   (TNBC, MSI, difuzní/lobulární/medulární typ, M1/N1, bilat./multifok., ...) —
   viz FLAGBY. Bez výslovného "ano" se kritérium nesplní (ani "nezjištěno",
   ani "ne"), takže text jako "MSI negativní" už nemůže nic splnit omylem. */
function tumFlagFields(x,i){
  var flags=FLAGBY[x.c];
  if(!flags||!flags.length)return '';
  if(!x.flags)x.flags={};
  return flags.map(function(fk){
    var v=x.flags[fk]||'';
    /* Otázka položená obráceně, než jak ji čte kritérium: „kuřák: ano/ne“
       místo matoucího „nekuřák: ano/ne“ (uživatelka 9.10.). Uložená hodnota
       i vyhodnocení kritéria zůstávají stejné — „kuřák ano“ = nekurak 'ne'. */
    var q=FLAGQ[fk];
    if(q)return '<div class="tflag"><span title="'+at(q.title)+'">'+esc(q.label)+'</span><div class="chips">'+
      chFlag(i,fk,'ne','ano',v==='ne')+
      chFlag(i,fk,'ano','ne',v==='ano')+
      chFlag(i,fk,'','?',!v)+
      '</div></div>';
    return '<div class="tflag"><span>'+esc(FLAGLABEL[fk]||fk)+'</span><div class="chips">'+
      chFlag(i,fk,'ano','ano',v==='ano')+
      chFlag(i,fk,'ne','ne',v==='ne')+
      chFlag(i,fk,'','?',!v)+
      '</div></div>';
  }).join('');
}

/* implausible values are highlighted, never blocked — typing "1954" passes
   through "1", "19", "195" and must not be interfered with */
function dateBad(p,f){
  if(numBad(p[f]))return true;          /* „45–50“, „1950/52“ — nejde přečíst jako jedno číslo */
  var v=num(p[f]);if(v===null)return false;
  var s=String(p[f]).trim();
  if(f==='age'||f==='adead')return v>125;
  if(s.length<4)return false;
  if(!yearOK(v))return true;
  if(f==='yod'){var yb=num(p.yob);if(yb!==null&&yearOK(yb)&&v<yb)return true;}
  return false;
}
function dateWarn(p){
  var w=[];
  if(dateBad(p,'yob'))w.push('rok narození');
  if(dateBad(p,'yod'))w.push('rok úmrtí');
  if(dateBad(p,'age'))w.push('věk');
  if(dateBad(p,'adead'))w.push('věk úmrtí');
  return w.length?'Zkontrolujte: '+w.join(', ')+'.':'';
}

function relName(id){
  var pr=theProband();if(!pr)return '';
  if(pr.id==id)return 'proband';
  var pp=parentsOf(pr.id);
  if(id==pp[0])return 'otec probanda';
  if(id==pp[1])return 'matka probanda';
  if(sibsOf(pr.id).indexOf(+id)>-1)return 'sourozenec probanda';
  var hs=halfSibsOf(pr.id);
  for(var q=0;q<hs.length;q++)if(hs[q].id==id)
    return ((P[hs[q].via]&&P[hs[q].via].sex==='F')?'maternální':'paternální')+
      ' nevlastní sourozenec probanda';
  var lbl={};
  [[pp[1],'matky'],[pp[0],'otce']].forEach(function(pr2){
    if(!pr2[0])return;var g2=parentsOf(pr2[0]);
    if(id==g2[0])lbl.v='otec '+pr2[1];
    if(id==g2[1])lbl.v='matka '+pr2[1];
    if(sibsOf(pr2[0]).indexOf(+id)>-1)
      lbl.v=(P[id].sex==='F'?'sestra ':'bratr ')+pr2[1];
  });
  return lbl.v||'';
}

  document.querySelectorAll('#sidebar [data-grm]').forEach(function(b){
    b.addEventListener('click',function(){snap();
      p.gd.splice(+b.getAttribute('data-grm'),1);draw();});});
  document.querySelectorAll('#sidebar [data-gadd]').forEach(function(b){
    b.addEventListener('click',function(){snap();
      if(!p.gd)p.gd=[];p.gd.push({c:'',st:'aff',sub:'',age:'',det:''});
      SECOPEN.genetika=true;draw();

  /* „+ Dvojče“: nový sourozenec rovnou jako dvojče (DZ — typ jde hned
     změnit), se stejným rokem narození; pořadí v řadě srovná autoOrder */
  document.querySelectorAll('#sidebar [data-twinadd]').forEach(function(b){
    b.addEventListener('click',function(){

      var tw=LASTADD;

      addTwinLink(me,tw,'DZ');
      if(P[me].yob&&!P[tw].yob)setDate(P[tw],'yob',P[me].yob);
      SECOPEN.twin=true;draw();});});        /* výběr zůstává na původní osobě (viz addRel) */
  document.querySelectorAll('#sidebar [data-tdc]').forEach(function(b){
    b.addEventListener('click',function(){snap();
      var t=p.tum[+b.getAttribute('data-tdc')];t.dc=!t.dc;
      if(t.dc&&!p.dead)setDead(p,true);   /* jedním klikem i označí osobu za zemřelou */
      draw();});});
  document.querySelectorAll('#sidebar [data-trm]').forEach(function(b){
    b.addEventListener('click',function(){snap();
      p.tum.splice(+b.getAttribute('data-trm'),1);draw();});});
  document.querySelectorAll('#sidebar [data-tadd]').forEach(function(b){
    b.addEventListener('click',function(){snap();
      if(!p.tum)p.tum=[];p.tum.push({c:'C50',age:'',det:''});draw();});});
  document.querySelectorAll('#sidebar [data-tflag]').forEach(function(b){
    b.addEventListener('click',function(){snap();
      var x=p.tum[+b.getAttribute('data-tflag')];if(!x)return;
      if(!x.flags)x.flags={};
