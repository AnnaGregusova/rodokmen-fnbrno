  document.querySelectorAll('#sidebar [data-ch]').forEach(function(b){
    b.addEventListener('click',function(){
      snap();
      var k=b.getAttribute('data-ch'),v=b.getAttribute('data-v'),u=unionsOf(p.id)[0];
      if(k==='sex')p.sex=v;else if(k==='sp')p.special=v;else if(k==='test')p.tested=v;
      else if(k==='aff1')p.aff=(p.aff===1?0:1);
      else if(k==='aff2')p.aff=(p.aff===2?0:2);
      else if(k==='healthy')p.healthy=!p.healthy;
      else if(k==='carrier')p.carrier=!p.carrier;
      else if(k==='dead')setDead(p,!p.dead);
      else if(k==='adopt')p.adopt=p.adopt?'':'in';
      else if(k==='consultand')p.consultand=!p.consultand;
      else if(k==='proband'&&!p.proband){for(var i in P)P[i].proband=false;
        p.proband=true;}
      else if(k==='cons'&&u)u.consang=!u.consang;
      else if(k==='term'&&u)u.term=!u.term;
      else if(k==='nok'){

           potřebuje kam se zapsat, tak se (stejně jako u "Potomek" bez
           partnera) tiše založí svazek jen s touhle osobou */
        if(!u)u=(p.sex==='F')?newUnion(null,p.id):newUnion(p.id,null);
        u.nokids=(u.nokids===v?'':v);
      }

        else addTwinLink(p.id,wid,(twinLinks(p.id)[0]&&twinLinks(p.id)[0].type)||'DZ');
      }

  /* zapamatovat si, které sekce má uživatel rozbalené */
  document.querySelectorAll('#sidebar details[data-sec]').forEach(function(d){

var PROGRAMMATIC_FOCUS=false;   /* ať pole vyvolaná redrawKeep nemyslí, že je uživatel znovu kliknul */
function redrawKeep(focusId){
  /* zapamatovat polohu kurzoru — překreslení jinak skočí na konec textu */
  var old=document.getElementById(focusId);
  var a=null,b=null;
  if(old){try{a=old.selectionStart;b=old.selectionEnd;}catch(e){}}
  draw();
  var el=document.getElementById(focusId);
  if(!el)return;
  PROGRAMMATIC_FOCUS=true;
  el.focus();
  PROGRAMMATIC_FOCUS=false;
  if(a===null){a=b=el.value.length;}
  if(a>el.value.length)a=el.value.length;
  if(b>el.value.length)b=el.value.length;
  try{el.setSelectionRange(a,b);}catch(e){}
}

/* ===================== structure edits ===================== */
function addRel(kind){
  if(!sel||!P[sel]){notify('Nejprve klikněte na osobu.');return;}
  snap();var p=P[sel];
  if(kind==='par'){
    if(p.pu&&U[p.pu]&&(U[p.pu].a||U[p.pu].b)){
      notify('Tato osoba už rodiče má.');hist.pop();return;}
    var f=newPerson({sex:'M'}),m=newPerson({sex:'F'});
    if(p.pu&&U[p.pu]){U[p.pu].a=f.id;U[p.pu].b=m.id;}   /* keep the sibship */
    else{var u=newUnion(f.id,m.id);u.kids=[p.id];p.pu=u.id;}
    LASTADD=m.id;
  } else if(kind==='sib'){
    if(!p.pu){var su=newUnion(null,null);su.kids=[p.id];p.pu=su.id;}
    var s=newPerson({sex:'M',pu:p.pu});U[p.pu].kids.push(s.id);LASTADD=s.id;
  } else if(kind==='partner'){
    if(spouseOf(p.id)){notify('Partner už existuje.');hist.pop();return;}
    var q=newPerson({sex:p.sex==='M'?'F':'M'});
    /* má-li osoba potomky zapsané zatím bez partnera, doplníme ho do
       stávajícího svazku, ať děti nezůstanou viset mimo */
    var slot=null;
    unionsOf(p.id).forEach(function(u){
      if(slot)return;
      if(u.a==p.id&&!u.b)slot={u:u,k:'b'};
      else if(u.b==p.id&&!u.a)slot={u:u,k:'a'};});
    if(slot)slot.u[slot.k]=q.id;else newUnion(p.id,q.id);
    LASTADD=q.id;
  } else if(kind==='child'){
    /* partner se nedoplňuje — pro genetiku není pokrevní příbuzný */
    var u2=unionsOf(p.id)[0];
    if(!u2)u2=(p.sex==='F')?newUnion(null,p.id):newUnion(p.id,null);
    var c=newPerson({sex:'M',pu:u2.id});u2.kids.push(c.id);LASTADD=c.id;
  } else if(kind==='halfM'||kind==='halfF'){
    var pp2=parentsOf(p.id);
    var shared=(kind==='halfM')?pp2[1]:pp2[0];
    if(!shared){notify('Nevlastní sourozenec „po '+(kind==='halfM'?'matce':'otci')+'“ '+
      'znamená sourozence, se kterým má vybraná osoba společn'+(kind==='halfM'?'ou matku':'ého otce')+
      ' (a jiného druhého rodiče).\n\n'+
      (kind==='halfM'?'Matka':'Otec')+' ale u vybrané osoby v rodokmenu není — '+
      'přidejte nejdřív tlačítkem „Rodiče“.');hist.pop();return;}
    /* only the shared parent is drawn — the other parent is irrelevant here
       and inventing one shifts the pedigree around */
    var hu=null;
    for(var uk in U){
      var par=[U[uk].a,U[uk].b].filter(Boolean);
      if(par.length===1&&par[0]==shared){hu=U[uk];break;}
    }
    if(!hu)hu=(P[shared].sex==='F')?newUnion(null,shared):newUnion(shared,null);
    var hc=newPerson({sex:'M',pu:hu.id});hu.kids.push(hc.id);LASTADD=hc.id;
  }
  /* výběr ZŮSTÁVÁ na osobě, ke které se přidává (přání uživatelky 9. 10. 2026):
     pořád „mluvím o téže osobě“ — několik sourozenců, nevlastních sourozenců
     nebo dětí za sebou bez překlikávání. Kdo chce pokračovat u nové osoby
     (např. přidat JEJÍ dítě), klikne na ni — zvýrazněná je pořád ta původní,
     takže je vidět, ke komu se další „Potomek“ přidá. */
  draw();
}
function sortByBirth(){
  snap();var done=false;
  for(var mk in U)U[mk].manual=false;   /* vrátí sibship k automatice */
  for(var k in U){
    var ks=U[k].kids.filter(function(i){return P[i];});
    if(ks.length<2)continue;
    ks.sort(byBirth);
    U[k].kids=groupTwins(ks);done=true;
  }
  if(!done)hist.pop();
  draw();
}
function move(d){
  if(!sel||!P[sel]||!P[sel].pu)return;
  var u=U[P[sel].pu];if(!u)return;
  /* dvojčata se posouvají jako jeden celek — nikdy se šipkou nerozdělí */
  var gs=twinGroups(u.kids.filter(function(i){return P[i];}));
  var gi=-1;gs.forEach(function(g,k){if(g.indexOf(+sel)>-1)gi=k;});
  if(gi<0)return;var j=gi+d;if(j<0||j>=gs.length)return;
  snap();var t=gs[gi];gs[gi]=gs[j];gs[j]=t;
  u.kids=[].concat.apply([],gs);
  u.manual=true;      /* ruční pořadí má přednost před automatikou */
  draw();
}
/* smazání probanda chce potvrzení: první stisk „ozbrojí“, druhý do 5 s maže
   (místo confirm(), který blokuje stránku i automatické testy) */
var DEL_ARMED=null,DEL_ARMED_AT=0;
function delSel(){
  if(!sel||!P[sel])return;
  if(P[sel].proband&&Object.keys(P).length>1){
    if(DEL_ARMED!==sel||!DEL_ARMED_AT||Date.now()-DEL_ARMED_AT>5000){
      DEL_ARMED=sel;DEL_ARMED_AT=Date.now();
      notify('Mazáte probanda — pro potvrzení stiskněte Smazat (Del) ještě jednou.','warn');
      return;
    }
    DEL_ARMED=null;
  }
  snap();var id=+sel;
  for(var k in U){
    U[k].kids=U[k].kids.filter(function(i){return i!=id;});
    if(U[k].a==id)U[k].a=null;
    if(U[k].b==id)U[k].b=null;
    /* a union is only removed once nothing is left hanging on it */
    if(!U[k].a&&!U[k].b&&U[k].kids.length<1){
      U[k].kids.forEach(function(i){if(P[i])P[i].pu=null;});
      delete U[k];
    }
  }
  delete P[id];
  Object.keys(P).forEach(function(i){
    if(P[i].pu&&!U[P[i].pu])P[i].pu=null;
    if(P[i].twin)P[i].twin=P[i].twin.filter(function(t){return t.with!=id;});});
  sel=null;
  if(!theProband()&&Object.keys(P).length){
    for(var j in P){P[j].proband=true;break;}}
  draw();
}
/* Nový případ musí smazat i záhlaví (jméno, RČ, indikace...) — jinak by v
   něm zůstaly údaje předchozího pacienta, ať už "Nový" přišel po autosave
   obnově nebo uprostřed práce. Datum se rovnou vyplní dneškem, jako při
   prvním otevření aplikace. */
function resetSheetFields(){
  IDF.forEach(function(i){var e=document.getElementById(i);if(e)e.value='';});
  var d=document.getElementById('idDate');
  if(d)d.value=new Date().toLocaleDateString('cs-CZ');
}
/* Nový případ = tvrdá hranice historie: Zpět/Znovu nesmí sáhnout přes ni
   do PŘEDCHOZÍHO případu (jinak by šlo obnovit starý rodokmen pod už
   přepsaným záhlavím jiného pacienta — viz resetSheetFields). Proto se
   sem nedává snap() a hist/redoHist se rovnou vyprázdní. */
function blank(){SIDES=null;P={};U={};nextP=1;nextU=1;
  var pr=newPerson({sex:'M'});pr.proband=true;
  sel=pr.id;resetSheetFields();hist=[];redoHist=[];
  CONSANG_CHECKED=false;OTHERFACTS_CHECKED=false;draw();}
function standard(){
  SIDES=null;P={};U={};nextP=1;nextU=1;
  var pr=newPerson({sex:'M'});pr.proband=true;
  var f=newPerson({sex:'M'}),m=newPerson({sex:'F'});
  var u=newUnion(f.id,m.id);u.kids=[pr.id];pr.pu=u.id;
  [f,m].forEach(function(par){
    var gf=newPerson({sex:'M'}),gm=newPerson({sex:'F'});
    var gu=newUnion(gf.id,gm.id);gu.kids=[par.id];par.pu=gu.id;});
  sel=pr.id;resetSheetFields();hist=[];redoHist=[];
  CONSANG_CHECKED=false;OTHERFACTS_CHECKED=false;draw();
}
/* Označení „II-3“ = generace (shora, římsky) a pořadí zleva v ní. Počítá se
   z posledního rozmístění (gen/pos), volá ho drawCore po každé změně; ručně
   se už nezadává. Vrací true, když se některé označení změnilo. */
function autoLabel(){
  var by={},mg=Infinity,ch=false;
  Object.keys(P).forEach(function(i){if(gen[i]!==undefined&&gen[i]<mg)mg=gen[i];});
  Object.keys(P).forEach(function(i){if(gen[i]===undefined)return;
    (by[gen[i]-mg]=by[gen[i]-mg]||[]).push(i);});
  Object.keys(by).forEach(function(g){
    by[g].sort(function(a,b){return ((pos[a]||0)-(pos[b]||0))||(a-b);})
      .forEach(function(i,n){var l=roman(+g+1)+'-'+(n+1);
        if(P[i].label!==l){P[i].label=l;ch=true;}});});
  return ch;
}

/* ===================== Czech genealogy text ===================== */
/* Format follows the consultation-transcript skill:
   one bullet per person, their siblings folded into that same sentence with ";",
   positional labels only (no dedecek/babicka/teta/stryc). */
/* Podle vzoru zpráv (references-genealogy-style): u dítěte „ROD MATKY
   PROBANDA“ / „Matka probanda“, u dospělého jen „ROD MATKY“ / „Matka“.
   Věk neznámý → šablona pro dítě (jako dřív). Obě funkce vracejí i úvodní
   mezeru, aby u dospělého nezůstala viset. */
function adultPerson(p){
  if(!p)return false;
  var a=num(p.age);
  if(a===null){var y=num(p.yob);if(yearOK(y))a=NOWY-y;}
  return a!==null&&a>=18;
}
function adultProband(){return adultPerson(theProband());}
/* O kom je zpráva (8.10., uživatelka). P = proband (první vyšetřený v rodině),
   šipka = kdo přišel dnes:
     • šipka chybí nebo je u probanda → zpráva o probandovi (jako dosud);
     • proband je dítě a šipka u jeho rodiče → rod toho rodiče (jako dosud);
     • šipka kdekoli jinde (kaskádové vyšetření sourozence, bratrance,
       dítěte probanda…) → zpráva o osobě se šipkou: dospělý = tazatel(ka),
       dítě nebo věk neznámý = pacient(ka); proband je v textu označen. */
function reportAnchor(){
  var pr=theProband();if(!pr)return null;
  var c=consultandId();
  if(c===null||c==pr.id||!P[c])return {id:pr.id,role:'proband'};
  if(!adultProband()){
    var pp=parentsOf(pr.id);
    if(c==pp[0]||c==pp[1])return {id:pr.id,role:'proband'};
  }
  return {id:+c,role:adultPerson(P[c])?'taz':'pac'};
}
var ANCH=null;        /* nastavuje genText/genTextParent po dobu skládání textu */
function anch(){return ANCH||reportAnchor();}
/* podmět první věty: Probandka / Tazatelka / Pacientka */
function anchorWord(a){
  var f=P[a.id]&&P[a.id].sex==='F';
  return a.role==='taz'?(f?'Tazatelka':'Tazatel'):a.role==='pac'?(f?'Pacientka':'Pacient')
    :(f?'Probandka':'Proband');
}
/* „ROD MATKY PROBANDKY“ / „Matka pacientky“; u dospělého (proband i tazatel)
   krátce „ROD MATKY“ / „Matka“ */
function G(){
  var a=anch();if(!a||!P[a.id])return '';
  var f=P[a.id].sex==='F';
  if(a.role==='taz'||(a.role==='proband'&&adultProband()))return '';
  return a.role==='pac'?(f?' PACIENTKY':' PACIENTA'):(f?' PROBANDKY':' PROBANDA');
}
function probW(){return G().toLowerCase();}
/* „(r. 1970)“ — a ve zprávě o někom jiném u probanda „(probandka, r. 1970)“ */
function idPart(p){
  var a=ANCH;
  if(!p||!p.proband||!a||a.role==='proband')return yearsPart(p);
  var w=(p.sex==='F'?'probandka':'proband'),y=yearsPart(p).replace(/^ \(|\)$/g,'');
  return ' ('+w+(y?', '+y:'')+')';
}

/* Krátký (jmenný) tvar se používá za podstatným jménem — tak, jak se píše
   ve zprávě: „bratr (r. 1948) zdráv“, „sestra zdráva“, „všechny zdrávy“.
   Ve 4. pádě (po „Má sestru, …“) se naopak hodí tvar dlouhý: „zdravou“. */
function healthy(p,acc){
  var n=p.n||1,f=(p.sex==='F');
  if(acc)return n>1?'zdravé':(f?'zdravou':'zdravého');
  if(n>1)return f?'zdrávy':'zdrávi';
  return f?'zdráva':'zdráv';
}
/* pořadí narození uvnitř sourozenecké řady (1. pád; tvar je pro obě
   pohlaví stejný). Smí se použít jen tam, kde je znám rok u všech. */
/* řadová číslovka v 1. pádě podle rodu: první, druhý/druhá, třetí… */
function ordNum(k,sex){
  var m=['první','druhý','třetí','čtvrtý','pátý','šestý','sedmý','osmý','devátý','desátý',
         'jedenáctý','dvanáctý'];
  var w=m[k-1];if(!w)return k+'.';
  return sex==='F'?w.replace(/ý$/,'á'):w;
}
/* klíč pro pořadí narození: rok narození, jinak odvozený z věku (žijící)
   nebo z roku a věku úmrtí; neznámé → null */
function birthKey(p){
  if(!p)return null;
  var y=num(p.yob);if(y)return y;
  var a=num(p.age);if(a!==null&&!p.dead)return NOWY-a;
  var yd=num(p.yod),ad=num(p.adead);if(yd&&ad!==null)return yd-ad;
  return null;
}
/* Pořadí sourozenců („první, druhý…“) se v textu vypíše jen tehdy, když je
   rok narození nebo věk u VŠECH vypisovaných sourozenců. Chybí-li jen
   u některých, panel to řekne — ať je jasné, co doplnit (7.10.). Osoba
   z linie probanda (ta, o jejíchž sourozencích se píše) se nepočítá. */
function ordHint(id){
  var p=P[id];if(!p||!p.pu||!U[p.pu])return '';
  var line={},pr=theProband();
  (function up(i){if(!i||line[i])return;line[i]=1;var q=parentsOf(i);up(q[0]);up(q[1]);})(pr&&pr.id);
  var ms=U[p.pu].kids.filter(function(i){return P[i]&&!P[i].special&&!line[i];});
  if(ms.length<2||ms.indexOf(+id)<0&&!line[id])return '';
  var miss=ms.filter(function(i){return birthKey(P[i])===null;}).length;
  if(!miss||miss===ms.length)return '';
  return 'Pořadí sourozenců (první, druhý…) se v textu vypíše, až bude rok narození '+
    'nebo věk u všech — chybí u '+miss+' z '+ms.length+'.';
}
/* „staršího bratra“ / „mladší sestru“ — 4. pád, pro jednoho sourozence */
function relAgeAcc(older,sex){
  var w=older?'starší':'mladší';
  return (sex==='F')?(w+' '):(w+'ho ');
}
/* 4. pád počtu dětí: „2 zdravé syny“, „zdravou dceru“, „5 dětí“ */
function kidsAcc(n,sex,hea){
  var f=(sex==='F'),m=(sex==='M');
  if(n===1)return (hea?(f?'zdravou ':(m?'zdravého ':'zdravé ')):'')+
    (f?'dceru':(m?'syna':'dítě'));
  var noun=f?(n<5?'dcery':'dcer'):(m?(n<5?'syny':'synů'):(n<5?'děti':'dětí'));
  return n+' '+(hea?(n<5?'zdravé ':'zdravých '):'')+noun;
}
/* 1. pád skupiny dětí ve výčtu: „2 děti zdravé“, „3 dcery zdrávy“ */
function kidsNom(n,sex,hea){
  var f=(sex==='F'),m=(sex==='M');
  var noun=(n===1)?(f?'dcera':(m?'syn':'dítě'))
    :(f?(n<5?'dcery':'dcer'):(m?(n<5?'synové':'synů'):(n<5?'děti':'dětí')));
  var s=(n===1?'':n+' ')+noun;
  /* holé „syn;“ ve výčtu zní jako chyba — řekne se, že se nic neví */
  if(!hea)return s+' bez bližších údajů';
  var adj=(n===1)?(f?'zdráva':(m?'zdráv':'zdrávo'))
                 :(f?'zdrávy':(m?'zdrávi':'zdravé'));
  /* „5 dětí, všechny zdravé“ — viz sourozenci výše */
  if(n>=5)return s+', '+(f?'všechny ':(m?'všichni ':'všechny '))+adj;
  return s+' '+adj;
}
/* podstatné jméno sourozence ve výčtu, i s případnou předponou a pořadím */
function sibNoun(p,prefix,ord){
  var n=p.n||1,f=(p.sex==='F'),m=(p.sex==='M');
  var base=f?(n===1?'sestra':(n<5?'sestry':'sester'))
           :(m?(n===1?'bratr':(n<5?'bratři':'bratrů'))
              :(n===1?'sourozenec':(n<5?'sourozenci':'sourozenců')));
  return (n===1?'':n+' ')+(prefix||'')+(ord?ord+' ':'')+base;
}
/* „má“ u žijících, „měl(a)“ u zemřelých — ve zprávě se o zemřelém příbuzném
   nepíše v přítomném čase („Otec matky + v 67 letech … měl 4 sestry“) */
function verbMit(p){return (p&&p.dead)?(p.sex==='F'?'měla':'měl'):'má';}
/* 4. pád jednotného čísla: „Má bratra / sestru / sourozence …“ */
function nounAcc(p){
  if(p.sex==='F')return 'sestru';
  if(p.sex==='M')return 'bratra';
  return 'sourozence';
}
/* 4. pád počtu sourozenců; jsou-li všichni stejného pohlaví, píše se to
   rovnou („měl 4 sestry“), jinak neutrálně („má 4 sourozence“) */
/* 4. pád počtu sourozenců. Jsou-li VŠICHNI nevlastní, řekne se to rovnou
   tady (a je-li navíc strana jen jedna, i ta) — v jednotlivých položkách
   výčtu se to pak už neopakuje. */
function sibsCountWord(n,sex,half,side,ageWord){
  var h=half?('nevlastní '+(side?side+' ':'')):'';
  var a=ageWord||'';
  /* od 5 výš 2. pád množného čísla i u přívlastků: „6 nevlastních
     paternálních sourozenců“, „5 mladších sester“ (ne „6 nevlastní…“) */
  if(n>=5){h=h.replace(/í /g,'ích ');a=a.replace(/í /g,'ích ');}
  if(sex==='F')return n+' '+h+a+(n<5?'sestry':'sester');
  if(sex==='M')return n+' '+h+a+(n<5?'bratry':'bratrů');
  if(half)return n+' '+h+a+(n<5?'sourozence':'sourozenců');
  return n+' '+a+(n<5?'sourozence':'sourozenců');
}
/* „v 52 letech“, ale „ve 2 / 12 / 32 letech“ — „ve“ před čísly, která se
   čtou od dv-/tř-/čt- (2–4, 12–14, 20–49); „v 1 roce“ */
function vLet(a){
  var s=String(a).trim(),n=/^\d+$/.test(s)?+s:null;
  if(n===0)return 'v 1. roce života';
  if(n===1)return 'v 1 roce';
  var ve=n!==null&&([2,3,4,12,13,14].indexOf(n)>-1||(n>=20&&n<=49));
  return (ve?'ve ':'v ')+s+' letech';
}
/* "(r. 1954)" for the living, "+ v 75 letech, cause" for the dead */
/* "na" fits a cause of death, but not "etio nejasná", "stáří" and similar */
function needsNa(c){
  var t=c.toLowerCase(),no=['nejasn','stář','sešlost','vysokém věku','neznám',
    'doplnit','věku','úraz','etio'];
  for(var i=0;i<no.length;i++)if(t.indexOf(no[i])>-1)return false;
  if(/^(na |po |v |pro |s |se )/.test(t))return false;
  return true;
}
/* nádory do věty: „ca prsu (dg. v 45 letech)“; u zemřelých se první nádor
   stává příčinou úmrtí, pokud není vyplněna jiná příčina */
/* podklady, na kterých motor kritéria vyhodnotil (příznaky, PSA/GS/stádium,
   počet polypů) musí jít dohledat i ve výstupu — jinak je nález "prsu ca ve
   45" bez patrného důvodu, proč zrovna on vyšel jako splňující kritérium */
function tumDetailParts(t){
  var parts=[];
  (FLAGBY[t.c]||[]).forEach(function(fk){
    if(t.flags&&t.flags[fk]==='ano')parts.push(FLAGLABEL[fk]||fk);
    /* obrácená otázka (kuřák): známé „ano“ do textu taky */
    else if(t.flags&&t.flags[fk]==='ne'&&FLAGQ[fk])parts.push(FLAGQ[fk].yes);
  });
  if(t.c==='C61'){
    if(numF(t.psa)!==null)parts.push('PSA '+t.psa+' µg/l');
    if(numF(t.gs)!==null)parts.push('GS '+t.gs);
    if(t.stage)parts.push(t.stage);
  }
  if((t.c==='C18'||t.c==='POLYPS')&&numF(t.polypCount)!==null)parts.push(t.polypCount+' polypů/adenomů');
  if(plain(t.det||'').trim())parts.push(plain(t.det).trim());
  return parts;
}
/* nom = 1. pád (styl „Matka: …“, za „Má sestru, …“); jinak 4. pád — za
   „má / měl(a) / + na …“ („+ na leukémii“, ne „na leukémie“) */
function tumPhrase(t,nom){
  var parts=tumDetailParts(t),detStr=parts.join(', ');
  return tumName(t,!nom)+(detStr?' ('+detStr+(t.age?', dg. '+vLet(t.age):'')+')'
                            :(t.age?' (dg. '+vLet(t.age)+')':''));
}
function tumAll(p,nom){return (p.tum||[]).map(function(t){return tumPhrase(t,nom);}).join(', ');}
/* nádor označený † je příčinou úmrtí, ostatní patří k „měl(a) …“ */
function tumCause(p){
  return (p.tum||[]).filter(function(t){return t.dc;}).map(function(t){return tumPhrase(t);}).join(' a ');}
function tumRest(p,nom){
  return (p.tum||[]).filter(function(t){return !t.dc;}).map(function(t){return tumPhrase(t,nom);}).join(', ');}
function causeOf(p){
  return [plain(p.cause),tumCause(p)].filter(Boolean).join(' a ');}
/* těhotenství ještě není "sourozenec"/"dítě" v obvyklém smyslu — nikdy ho
   nelze popsat jako "zdravý/á", ani ho tak počítat do zdravé skupiny */
function specialLabel(sp){
  return sp==='SAB'?'spontánní abortus':sp==='TOP'?'uměle přerušené těhotenství (UPT)'
    :sp==='PREG'?'probíhající těhotenství':null;
}
/* o: {acc} = stav dát do 4. pádu („Má sestru, zdravou“),
      {quiet} = nedopisovat, že se nic neví (věta pokračuje něčím dalším,
      typicky výčtem dětí — opakovat u každého „bližší údaje neuvádí“ by
      zprávu jen natáhlo) */
/* „(r. 1970)“, nebo aspoň „(45 let)“ — u žijícího */
function ageWords(a){return a===1?'1 rok':(a>=2&&a<=4?a+' roky':a+' let');}
function yearsPart(p){
  if(!p||p.dead)return '';
  if(p.yob)return ' (r. '+p.yob+')';
  var a=num(p.age);
  return a!==null?' ('+ageWords(a)+')':'';
}
/* Nález osoby se píše v 1. pádě, tak jak ho lékař zapíše do dokumentace —
   věta volí vazby, které skloňování nepotřebují (7.10., uživatelka: „ať
   text po zkopírování nemusím opravovat“):
     žijící:   „Matka (r. 1970) – hypotyreóza, v anamnéze cholecystektomie“
     zemřelý:  „Matka matky + v 78 letech na infarkt myokardu, v anamnéze
               ca prsu (dg. v 62 letech), hypertenze“  (příčinu úmrtí
               skloňuje uživatelka sama — „na …“ zůstává)
     nic:      „– bez bližších údajů“; zná-li se rok/věk, „– zdravotní stav
               neznámý“; zemřelý „+, věk a etio nejasné“ */
function personPhrase(p,name,o){
  var spLab=specialLabel(p.special);
  if(spLab)return (name+' — '+spLab).replace(/\s+/g,' ').trim();
  var f=(p.sex==='F'),acc=!!(o&&o.acc),quiet=!!(o&&o.quiet);
  var s=name+idPart(p),h=plain(p.hist).trim();
  if(p.dead){
    var ap=p.adead?' '+vLet(p.adead):(p.yod?' r. '+p.yod:'');
    s+=' +'+ap;
    var cause=causeOf(p);
    var rest=[plain(tumRest(p,true)),plain(gdAll(p,true)),plain(p.cond),h].filter(Boolean).join(', ');
    if(cause)s+=(needsNa(cause)?' na ':(ap?', ':' '))+cause;
    /* neznámé údaje krátce a „lékařsky“, jak se píše ve zprávách:
       „+ v 75 letech, etio nejasné“ (references-genealogy-style) */
    else if(ap)s+=', etio nejasné';
    if(!ap&&!cause)s+=', věk a etio nejasné';
    else if(!ap)s+=', věk nejasný';
    if(rest)s+=', v anamnéze '+rest;
  } else {
    var c=[plain(tumAll(p,true)),plain(gdAll(p,true)),plain(p.cond).trim()].filter(Boolean).join(', ');
    var hp=h?', v anamnéze '+h:'';
    if(c)s+=' – '+c+hp;
    else if(p.aff===1)s+=' '+(f?'postižená':'postižený')+' — doplnit dg.'+hp;
    else if(p.aff===2)s+=', jiná dg. — doplnit'+hp;
    else if(p.carrier)s+=' '+(f?'přenašečka':'přenašeč')+hp;
    /* "zdravý/á" jen když to bylo aktivně zjištěno a zaškrtnuto — prázdné
       pole samo o sobě neznamená zdráv(a), jen že to nikdo neověřil */
    else if(p.healthy)s+=' '+healthy(p,acc)+hp;
    else if(h)s+=' – v anamnéze '+h;
    else if(!quiet)s+=yearsPart(p)?' – zdravotní stav neznámý':' – bez bližších údajů';
  }
  /* adopce mění, kdo je pokrevní příbuzný (viz biolParentsOf) — musí to jít
     poznat i v textu, ne jen z ikony v rodokmenu */
  if(p.adopt)s+=' (adoptivní vztah)';
  return s.replace(/\s+/g,' ').trim();
}
/* má osoba u některého dítěte vlastní nález? */
function kidHasFindings(i){
  var p=P[i];
  return !!(p.proband||p.cond||p.hist||p.dead||p.aff||p.carrier||(p.tum&&p.tum.length)||gdList(p).length||
    p.special||p.adopt);
}
function kidsPhrase(id,acc){
  var me=P[id],ks=kidsOf(id);
  if(!ks.length){
    /* bezdětnost je údaj, ne mlčení — do textu patří, když je zaškrtnutá
       (ve 4. pádě za „Má sestru …“ pak „bezdětnou“) */
    var u=unionsOf(id)[0],nk=u&&u.nokids;
    if(nk==='choice')return ', '+(me.sex==='F'?(acc?'bezdětnou':'bezdětná')
                                              :(acc?'bezdětného':'bezdětný'));
    if(nk==='inf')return ', infertilita';
    return '';
  }
  var tot=0,sexes={};
  ks.forEach(function(i){tot+=(P[i].n||1);sexes[P[i].sex]=1;});
  var sx=Object.keys(sexes);
  var oneSex=(sx.length===1&&(sx[0]==='M'||sx[0]==='F'))?sx[0]:null;
  var bad=ks.filter(kidHasFindings);
  var rest=ks.filter(function(i){return !kidHasFindings(i);});
  /* Nikdo z dětí nemá nález: stačí jedna zkratka. Zdravé se řeknou jako
     zdravé, u ostatních se uvede jen počet — mlčení se nesmí vydávat za
     potvrzené zdraví, ale ani opakovat „nezjištěno“ u každé rodiny. */
  if(!bad.length){
    var allH=rest.every(function(i){return P[i].healthy;});
    return ', '+verbMit(me)+' '+kidsAcc(tot,oneSex,allH);
  }
  /* Jediné dítě s nálezem se napíše rovnou ve 4. pádě („má syna, ca prsu
     v 52 letech“). Se jménem v 1. pádě by věta zněla „má syn má ca prsu“ —
     dvakrát přísudek. */
  if(tot===1&&bad.length===1){
    var c1=bad[0],cs=P[c1].sex;
    return ', '+verbMit(me)+' '+
      personPhrase(P[c1],(cs==='F'?'dceru':(cs==='M'?'syna':'dítě')),
                   {acc:true,quiet:true});
  }
  /* aspoň o jednom dítěti se píše podrobně — napřed počet, pak výčet */
  var parts=bad.map(function(i){
    var s2=P[i].sex;
    return personPhrase(P[i],(s2==='F'?'dcera':(s2==='M'?'syn':'dítě')),{quiet:true});});
  var hs=rest.filter(function(i){return P[i].healthy;});
  var un=rest.filter(function(i){return !P[i].healthy;});
  function cnt(list){var n=0;list.forEach(function(i){n+=(P[i].n||1);});return n;}
  function sexOf(list){
    var o={};list.forEach(function(i){o[P[i].sex]=1;});
    var k=Object.keys(o);return (k.length===1&&(k[0]==='M'||k[0]==='F'))?k[0]:null;}
  if(hs.length)parts.push(kidsNom(cnt(hs),sexOf(hs),true));
  if(un.length)parts.push(kidsNom(cnt(un),sexOf(un),false));
  return ', '+verbMit(me)+' '+kidsAcc(tot,oneSex,false)+': '+parts.join('; ');
}
/* dvojče/vícerče se do textu musí dostat i tehdy, když je jinak úplně
   zdravý(á) — jinak by se ztratil v mlčenlivě sečteném počtu (viz
   noFindings výš). anchorId = osoba, jejíž sourozence zrovna popisujeme:
   dvojče s ní samotnou se jmenovat nemusí ("dvojče"), dvojče s JINÝM
   sourozencem se musí pojmenovat, ať je jasné, kdo s kým. */
function twinNoteFor(id,anchorId){
  var tls=twinLinks(id);
  if(!tls.length)return '';
  var type=tls[0].type;
  var others=tls.filter(function(t){return t.with!=anchorId&&P[t.with];})
    .map(function(t){return P[t.with];});
  var word=tls.length>1?'vícerče':'dvojče';
  /* bez označení se sourozenec jmenuje vztahem („se sestrou“) — interní
     číslo „#6“ do zprávy nepatří; dvojčata stojí v textu vedle sebe, takže
     je hned jasné, o koho jde */
  var withWho='';
  if(others.length){
    var allLab=others.every(function(q){return q.label;});
    if(allLab)withWho=' se '+(others.length===1?'sourozencem':'sourozenci')+' '+
      others.map(function(q){return q.label;}).join(', ');
    else withWho=' '+others.map(function(q){
      return q.sex==='F'?'se sestrou':(q.sex==='M'?'s bratrem':'se sourozencem');}).join(' a ');
  }
  return ' ('+word+withWho+' – '+type+')';
}
/* Abortus / UPT / probíhající těhotenství NEJSOU sourozenci — dřív se
   započítaly („Má 2 bratry: bratr…; bratr — spontánní abortus“). Uvedou se
   zvlášť jednou krátkou větou za sourozenci. */
function specialSibsTail(id){
  var cnt={SAB:0,TOP:0,PREG:0};
  sibsOf(id).concat(halfSibsOf(id).map(function(h){return h.id;})).forEach(function(i){
    var p=P[i];if(p&&cnt[p.special]!==undefined)cnt[p.special]+=(p.n||1);});
  var parts=[];
  if(cnt.SAB)parts.push(cnt.SAB+'× spontánní abortus');
  if(cnt.TOP)parts.push(cnt.TOP+'× UPT');
  if(cnt.PREG)parts.push('probíhající těhotenství');
  return parts.join(', ');
}
/* who = jak popisovanou osobu nazvat v navazující větě („Dále matka má…“) */
function sibsSentence(id,subject,noSib,who){
  var core=sibsSentenceCore(id,subject,noSib,who),tail=specialSibsTail(id);
  if(!tail)return core;
  return core?core+' Dále '+tail+'.':(subject?subject+' — ':'Sourozenci: ')+tail+'.';
}
/* Sourozenci jedné osoby. Vlastní sourozenci, nevlastní po matce a nevlastní
   po otci jsou ZVLÁŠTNÍ skupiny, každá s vlastním počtem a vlastním
   pořadím narození (uživatelka 6.10.): „Má 2 nevlastní maternální
   sourozence: …. Dále matka má 6 nevlastních paternálních sourozenců: …“ */
function sibsSentenceCore(id,subject,noSib,who){
  var sb=sibsOf(id).map(function(i){return {id:i,half:false};});
  halfSibsOf(id).forEach(function(h){sb.push({id:h.id,half:true,via:h.via});});
  sb=sb.filter(function(o){return !P[o.id].special;});
  if(!sb.length){
    /* "je jedináček" je tvrzení, ne jen mlčení — smí padnout jen když u
       téhle osoby bylo sourozence aktivně zjišťováno a potvrzeno, že
       žádní nejsou. Jinak prázdný rodokmen neznamená potvrzenou absenci,
       jen že to zatím nikdo nezjišťoval — věta se pak celá vynechá. */
    if(!P[id]||!P[id].sibsChecked)return null;
    if(noSib)return subject+' sourozence nemá.';
    return subject?subject+' je jedináček.':'Je jedináček.';
  }
  var v=verbMit(P[id]);
  var lead=subject?(subject+' '+v+' '):(v.charAt(0).toUpperCase()+v.slice(1)+' ');
  function viaF(o){return P[o.via]&&P[o.via].sex==='F';}
  var groups=[sb.filter(function(o){return !o.half;}),
              sb.filter(function(o){return o.half&&viaF(o);}),
              sb.filter(function(o){return o.half&&!viaF(o);})]
    .filter(function(g){return g.length;});
  if(groups.length<2)return sibsGroup(id,sb,lead);
  var w=who||(subject?subject.charAt(0).toLowerCase()+subject.slice(1):'');
  var lead2='Dále '+(w?w+' ':'')+v+' ';
  return groups.map(function(g,i){return sibsGroup(id,g,i?lead2:lead);}).join(' ');
}
/* jedna skupina sourozenců (všichni vlastní, nebo všichni nevlastní z téže
   strany) jako jedna věta */
function sibsGroup(id,sb,lead){
  var me=P[id],total=0;sb.forEach(function(o){total+=(P[o.id].n||1);});

  /* Pořadí narození („starší bratr“, „nejmladší sestra“) smí text tvrdit jen
     tehdy, když zná rok narození u VŠECH vypsaných — jinak by pořadí jen
     hádal podle toho, jak jsou zrovna nakresleni. */
  /* pořadí se pozná z roku narození, NEBO z věku (žijící), NEBO z roku
     a věku úmrtí — stačí, když je u každého aspoň jedno z toho */
  var allYears=sb.every(function(o){return birthKey(P[o.id])!==null;});
  if(allYears)sb.sort(function(a,b){return birthKey(P[a.id])-birthKey(P[b.id]);});
  /* pořadí narození se počítá z tohoto (roky) pořadí — ještě před tím, než
     se dvojčata přeskupí */
  var birthIdx={};sb.forEach(function(o,i){birthIdx[o.id]=i;});
  /* Dvojčata: vlastní dvojče popisované osoby jde první (to je pro ni
     nejdůležitější sourozenec), dvojčata mezi ostatními sourozenci jdou
     v textu hned po sobě — stejně jako v kresbě. */
  (function(){
    var byId={};sb.forEach(function(o){byId[o.id]=o;});
    var mine=sb.filter(function(o){return isTwinWith(id,o.id);});
    var rest=groupTwins(sb.filter(function(o){return !isTwinWith(id,o.id);})
      .map(function(o){return o.id;})).map(function(i){return byId[i];});
    sb=mine.concat(rest);
  })();
  var myY=birthKey(me),ageWord='';
  if(allYears&&myY){
    if(sb.every(function(o){return birthKey(P[o.id])<myY;}))ageWord='starší ';
    else if(sb.every(function(o){return birthKey(P[o.id])>myY;}))ageWord='mladší ';
  }

  /* pohlaví a „nevlastnost“ celé řady — co je společné, řekne se jednou
     v počtu a v jednotlivých položkách se to už neopakuje */
  var oneSex=null,mixedSex=false,allHalf=true,oneSide=null,mixedSide=false;
  sb.forEach(function(o){
    if(!o.half)allHalf=false;
    else{
      var sd=(P[o.via]&&P[o.via].sex==='F')?'maternální':'paternální';
      if(oneSide===null)oneSide=sd;else if(oneSide!==sd)mixedSide=true;
    }
    var s=P[o.id].sex;
    if(s!=='M'&&s!=='F'){mixedSex=true;return;}
    if(oneSex===null)oneSex=s;else if(oneSex!==s)mixedSex=true;});
  var sexKey=mixedSex?null:oneSex;
  var sideOnce=(allHalf&&!mixedSide)?oneSide:null;

  /* JEDEN jediný sourozenec se nepočítá — píše se rovnou ve 4. pádě
     („Má mladšího bratra (r. 1973), má DMII…“), jak to stojí ve zprávě.
     Počet s dvojtečkou má smysl teprve od dvou výš. */
  if(total===1&&sb.length===1){
    var o1=sb[0],p1=P[o1.id],nm1='';
    /* 4. pád: „nevlastního maternálního bratra“, „nevlastní maternální
       sestru“; pořadí narození se u nevlastních vynechává (house style) */
    if(o1.half){
      var fem1=(p1.sex==='F');
      nm1=(fem1?'nevlastní ':'nevlastního ')+
        (oneSide?(fem1?oneSide:oneSide.replace(/í$/,'ího'))+' ':'');
    }
    else if(allYears&&myY)nm1+=relAgeAcc(birthKey(p1)<myY,p1.sex);
    nm1+=nounAcc(p1);
    var kp1=kidsPhrase(o1.id,true);
    return dot(lead+personPhrase(p1,nm1,{acc:true,quiet:!!kp1})+
               twinNoteFor(o1.id,id)+kp1);
  }

  /* Nemá-li nikdo z nich vlastní nález, nemá smysl je vypisovat po jednom —

     zdravé“). Platí to jen tehdy, když ani u JEJICH dětí nic není: jinak by
     se ve zkratce ztratil nemocný synovec. */
  function noFind(o){

       by ji ztratilo (např. „bratr (r. 1998) zdráv, bezdětný“) */
    var u0=unionsOf(o.id)[0];
    return !p.proband&&!p.yod&&!p.cond&&!p.hist&&!p.dead&&!p.aff&&!p.carrier&&!(p.tum&&p.tum.length)&&
      !gdList(p).length&&!(u0&&u0.nokids)&&
      !p.special&&!p.adopt&&!twinLinks(o.id).length;
  }

      if(kidHasFindings(c))kidsClean=false;
      if(!P[c].healthy)kidsAllH=false;});});

  var allH=allPlain&&sb.every(function(o){return P[o.id].healthy;});
  var allU=allPlain&&sb.every(function(o){return !P[o.id].healthy;});

     k dotyčnému (mladší/starší) se proto uvádí jen tam, kde se řada shrne
     jednou větou a žádné pořadí uvnitř se nevypisuje. */

  var cw=sibsCountWord(total,sexKey,allHalf,sideOnce,collapsed?ageWord:'');

    var known=sb.some(function(o){return yearsPart(P[o.id]);});
    var s2=lead+cw+', '+(allH?((sexKey==='F')?'všechny zdrávy':'všichni zdrávi')

     do jednoho počtu (zdraví a nezjištění zvlášť, ať se ticho nevydává za
     potvrzené zdraví) */
  var groups={},order=[],out=[],sideSeen={};
  sb.forEach(function(o,i){
    var p=P[o.id];
    /* nevlastní se do počtu („4 bratři zdrávi“) smí slít jen tam, kde to,
       že jsou nevlastní a z které strany, už řekl počet celé skupiny */
    var bare=noFind(o)&&!p.yob&&!p.age&&(!o.half||sideOnce)&&!kidsOf(o.id).length;
    if(bare){
      var kind=p.healthy?'zdrav':'nezjist',k=kind+'-'+p.sex;
      if(!groups[k]){groups[k]={sex:p.sex,n:0,kind:kind};order.push(k);}
      groups[k].n+=(p.n||1);

      var k2='x'+o.id;groups[k2]={one:o,idx:i};order.push(k2);
    }
  });
  /* stojí-li ve výčtu počet („4 bratři zdrávi“), jednotlivci dostanou
     „jeden/jedna“ — „4 bratři zdrávi; jedna sestra zdráva“ (uživatelka 6.10.) */
  var anyCount=order.some(function(k){var g=groups[k];
    return g.one?(P[g.one.id].n||1)>1:g.n>1;});
  function oneWord(sex){return sex==='F'?'jedna ':'jeden ';}
  order.forEach(function(k){
    var g=groups[k];
    if(g.one){
      var o=g.one,p=P[o.id],pref='';
      if(o.half){
        var sd=(P[o.via]&&P[o.via].sex==='F')?'maternální':'paternální';
        /* „nevlastní“ i strana zazní u první takové položky; u dalších už
           by se to jen opakovalo. Řekl-li to rovnou počet, mlčíme úplně. */
        if(sideOnce)pref='';

        else {pref='nevlastní '+(sideSeen[sd]?'':sd+' ');sideSeen[sd]=1;}
      }

         starší sestra“ už je na jednu osobu moc přívlastků a „nevlastní“
         ji odliší samo */
      /* dvojče žádné „starší/mladší“ nemá — narodilo se se sourozencem naráz */
      /* „první bratr, druhá sestra…“ — pořadí v řadě vypisovaných
         sourozenců podle narození (uživatelka 5.10.: přehlednější než
         starší/mladší/prostřední) */
      var ord=(allYears&&sb.length>1&&(p.n||1)===1&&!pref&&!twinLinks(o.id).length)?
        ordNum(birthIdx[o.id]+1,p.sex):'';
      var kp=kidsPhrase(o.id),nm=sibNoun(p,pref,ord);
      if(anyCount&&!ord&&(p.n||1)===1)nm=oneWord(p.sex)+nm;
      var php=personPhrase(p,nm,{quiet:!!kp}),tw=twinNoteFor(o.id,id);
      /* o sourozenci samém nic (jen „sestra (r. 1953)“) → děti navazují bez
         čárky: „sestra (r. 1953) má 2 zdravé syny“, ne „…(r. 1953), má…“ */
      if(kp&&!tw&&/^, /.test(kp)&&php===nm+idPart(p))kp=kp.slice(1);
      out.push(php+tw+kp);
    } else {
      var fake={sex:g.sex,n:g.n};
      /* od 5 výš je podmět v 2. pádě („5 bratrů“) — „5 bratrů zdrávi“ je
         chyba, správně „5 bratrů, všichni zdrávi“ */
      out.push((anyCount&&g.n===1?oneWord(g.sex):'')+sibNoun(fake,'','')+
        (g.kind==='zdrav'?(g.n>=5?', '+(g.sex==='F'?'všechny ':'všichni ')+healthy(fake)
                                  :' '+healthy(fake))
                         :' bez bližších údajů'));
    }
  });
  /* od tří položek „…; …; a …“ — je hned vidět, že výčet končí */
  if(out.length>=3)out[out.length-1]='a '+out[out.length-1];
  return lead+cw+': '+out.join('; ')+'.';
}
/* one bullet: the person, then their siblings, in flowing sentences */
function personBullet(id,label){
  var p=P[id];if(!p)return '- '+label+': doplnit';
  /* „Dále matka má …“ — v navazující větě jen první slovo popisku */
  var sib=sibsSentence(id,null,false,String(label).split(' ')[0].toLowerCase());
  /* pokračuje-li věta sourozenci, nemá smysl u samotné osoby hlásit, že se
     o ní nic neví — čte se to jako výplň a jen to prodlužuje zprávu */
  var ph=personPhrase(p,label,{quiet:!!sib});
  /* O osobě samé není co říct (jen jméno, případně rok narození): věta
     o sourozencích na ni rovnou navazuje — „Matka probanda má 4 sourozence:“
     místo „Matka probanda. Má 4 sourozence:“ (uživatelka 5.10.) */
  if(sib&&/^(Má|Měl|Měla) /.test(sib)&&ph===label+idPart(p))
    return '- '+ph+' '+sib.charAt(0).toLowerCase()+sib.slice(1);
  return '- '+dot(ph)+(sib?' '+sib:'');
}
function dot(s){s=s.trim();return /[.!?]$/.test(s)?s:s+'.';}
/* O osobě se neví vůbec nic? 'alive' = žije a není znám ani rok/věk, ani
   zdraví; 'dead' = zemřel(a), ale neví se kdy ani na co. Jinak null.
   Dva lidé ze stejné generace se stejným „nic“ se pak napíšou jednou
   („Matka a otec otce – bez bližších údajů“) místo dvakrát (7.10.). */
function noInfoKind(id){
  var p=P[id];
  if(!p||p.proband||p.special||p.adopt||twinLinks(id).length)return null;
  if(p.cond||p.hist||p.aff||p.carrier||(p.tum&&p.tum.length)||gdList(p).length)return null;
  if(p.dead)return (!p.adead&&!p.yod&&!plain(p.cause).trim())?'dead':null;
  return (!yearsPart(p)&&!p.healthy)?'alive':null;
}
function grandBullet(gpId,word,kind){
  /* inside a prarodice bullet only "matka" and "otec" may be used */
  var gg=parentsOf(gpId);
  if(!gg[0]&&!gg[1])return null;
  if(gg[0]&&gg[1]){
    var k=noInfoKind(gg[1]);
    if(k&&k===noInfoKind(gg[0]))
      return '- '+word+' prarodiče '+kind+(k==='alive'?' – bez bližších údajů.'
                                                     :': oba +, věk a etio nejasné.');
  }
  return '- '+word+' prarodiče '+kind+': '+
    (gg[1]?personPhrase(P[gg[1]],'matka'):'matka doplnit')+'; '+
    dot(gg[0]?personPhrase(P[gg[0]],'otec'):'otec doplnit');
}
function lineage(pid,kind,parentWord){
  var out=[],p=P[pid];
  if(!p)return ['- '+parentWord+': doplnit'];
  out.push(personBullet(pid,parentWord));
  var pp=parentsOf(pid);
  var gm=pp[1],gf=pp[0];
  /* oba prarodiče bez jakýchkoli údajů, bez zapsaných sourozenců i předků
     → jedna věta za oba */
  if(gm&&gf){
    var k=noInfoKind(gm);
    var bare=function(i){var q=parentsOf(i);return !q[0]&&!q[1]&&!sibsSentence(i,null);};
    if(k&&k===noInfoKind(gf)&&bare(gm)&&bare(gf)){
      out.push('- Matka a otec '+kind+(k==='alive'?' – bez bližších údajů.':' +, věk a etio nejasné.'));
      return out;
    }
  }
  if(gm){
    out.push(personBullet(gm,'Matka '+kind));
    var b1=grandBullet(gm,'Maternální',kind);if(b1)out.push(b1);
  } else out.push('- Matka '+kind+': doplnit');
  if(gf){
    out.push(personBullet(gf,'Otec '+kind));
    var b2=grandBullet(gf,'Paternální',kind);if(b2)out.push(b2);
  } else out.push('- Otec '+kind+': doplnit');
  return out;
}
function consultandId(){
  for(var i in P)if(P[i].consultand)return i;
  return null;
}
/* Který rodič je na této stránce zpracován: pokud je konzultandem jeden
   z rodičů dítěte, je celá stránka jeho rodem a patří do jedné sekce. */
function focusSide(){
  var pr=theProband();if(!pr)return null;
  /* jen u dítěte: u dospělého probanda je šipka u rodiče kaskáda (tazatel) */
  if(adultProband())return null;
  var c=consultandId();
  if(c===null||c==pr.id)return null;
  var pp=parentsOf(pr.id);
  if(pp[0]&&c==pp[0])return 'F';
  if(pp[1]&&c==pp[1])return 'M';
  return null;
}
/* jedna větev (rod matky / rod otce) — společné pro genText i „Obě strany“
   (audit #2, M10: dřív dvě kopie téže logiky) */
function branchHead(fs){return 'ROD '+(fs==='F'?'OTCE':'MATKY')+G();}
function branchLines(fs,pp){
  return fs==='F'?lineage(pp[0],'otce','Otec'+probW()):lineage(pp[1],'matky','Matka'+probW());
}
function genText(){
  var pr=theProband();
  if(!pr)return 'Není označen proband.';
  ANCH=reportAnchor();
  try{return genTextCore(ANCH);}finally{ANCH=null;}
}
function genTextCore(a){
  var me=P[a.id];
  var cons=false;for(var k in U)if(U[k].consang)cons=true;
  var L=['Genealogie:','==================='];
  /* "příbuznost rodičů neuvádí" je tvrzení o něčem AKTIVNĚ zjišťovaném —
     smí padnout jen po výslovném potvrzení (CONSANG_CHECKED). Skutečně
     udávaná příbuznost (cons=true) je naopak reálný zadaný údaj, ten se
     píše vždy. */
  if(cons)L.push('- V rodině udávána příbuznost rodičů — doplnit stupeň.');
  else if(CONSANG_CHECKED)L.push('- Příbuzenské vztahy v rodině neuvádí');
  var sibsLine=sibsSentence(me.id,anchorWord(a));
  if(sibsLine)L.push('- '+sibsLine);
  var pp=parentsOf(me.id);
  var fs=(a.role==='proband')?focusSide():null;
  if(fs){
    /* šipka u rodiče dítěte — celá stránka je jen jeho rod. Poznámku
       „(druhá větev rodiny zpracována zvlášť)“ uživatelka v textu nechce
       (11. 10.) — nadpis „ROD OTCE PROBANDA:“ stačí. Slovo „konzultand“
       do zprávy nepatří (8.10.). */
    L.push(branchHead(fs)+':');
    L=L.concat(branchLines(fs,pp));
  } else {
    L.push('ROD MATKY'+G()+':');
    L=L.concat(pp[1]?lineage(pp[1],'matky','Matka'+probW())
      :['- Matka'+probW()+': doplnit']);
    L.push('ROD OTCE'+G()+':');
    L=L.concat(pp[0]?lineage(pp[0],'otce','Otec'+probW())
      :['- Otec'+probW()+': doplnit']);
  }
  if(OTHERFACTS_CHECKED)
    L.push('Další genealogicky významné skutečnosti neuvádí, podrobněji viz karta ÚLGG.');
  return L.join('\n');
}
/* Genealogy re-anchored to a parent, for the parent (tazatel/ka) reports.
   Per the parent-reports skill: keep only that parent's own family, split it
   into two ROD sections, and shift every label one generation down. */
function genTextParent(which){
  var a=reportAnchor();
  if(!a)return 'Není označen proband.';
  /* rodiče toho, o kom je zpráva (dítě-proband, nebo pacient/ka se šipkou);
     proband se v jejich textu označí, objeví-li se tam */
  var pp=parentsOf(a.id),par=(which==='M')?pp[1]:pp[0];
  ANCH={id:par||a.id,role:'parent'};
  try{return genTextParentCore(which,pp);}finally{ANCH=null;}
}
function genTextParentCore(which,pp){
  var anchor=(which==='M')?pp[1]:pp[0];
  var TAZ=(which==='M')?'TAZATELKY':'TAZATELE';
  var subj=(which==='M')?'Tazatelka':'Tazatel';
  if(!anchor)return (which==='M'?'Matka':'Otec')+
    ' není v rodokmenu zadán(a) — nelze vytvořit zprávu.';
  var cons=false;for(var k in U)if(U[k].consang)cons=true;
  var L=['Genealogie:','=========='];
  if(cons)L.push('V rodině udávána příbuznost rodičů — doplnit stupeň.');
  else if(CONSANG_CHECKED)L.push('Příbuzenské vztahy v rodině neuvádí');
  var sibsLine=sibsSentence(anchor,subj,true);
  if(sibsLine)L.push(sibsLine);
  var gp=parentsOf(anchor);          /* gp[0] = otec, gp[1] = matka */
  /* rodina druhého rodiče se sem nedává (viz showText/txtHint); poznámka
     v závorce za nadpisem se nepíše (11. 10.) */
  L.push('ROD MATKY '+TAZ+':');
  L=L.concat(gp[1]?lineage(gp[1],'matky','Matka'):['- Matka: doplnit']);
  L.push('ROD OTCE '+TAZ+':');
  L=L.concat(gp[0]?lineage(gp[0],'otce','Otec'):['- Otec: doplnit']);
  if(OTHERFACTS_CHECKED)
    L.push('Další genealogicky významné skutečnosti neuvádí, '+
      'podrobněji viz karta ÚLGG.');
  return L.join('\n');
}

function wrapTo(t,n){
  var w=String(t).split(/\s+/),ln=[],c='';
  w.forEach(function(x){
    var cand=c?c+' '+x:x;
    if(cand.length<=n)c=cand;else{if(c)ln.push(c);c=x;}});
  if(c)ln.push(c);return ln;
}
function buildExportSVG(){
  var src=document.getElementById('ped');
  var vb=(src.getAttribute('viewBox')||'0 0 1400 600').split(/\s+/).map(Number);
  var W=vb[2],PH=vb[3],M=24;
  /* work on a clone through the DOM, never on markup strings */
  var clone=src.cloneNode(true);
  var hits=clone.querySelectorAll('.hit');
  for(var i=hits.length-1;i>=0;i--)hits[i].parentNode.removeChild(hits[i]);
  var sels=clone.querySelectorAll('.sel');
  for(var j=0;j<sels.length;j++)sels[j].setAttribute('class',
    String(sels[j].getAttribute('class')||'').replace(/\s*\bsel\b/,''));
  var idv=function(i){var e=document.getElementById(i);return e?e.value.trim():'';};
  var t1=[idv('idName'),idv('idRc')].filter(Boolean).join(' · ');
  var t2=[idv('idDx'),idv('idDate'),idv('idDoc')].filter(Boolean).join(' · ');
  var headH=(t1||t2)?42:14;
  var items=[];
  Object.keys(P).sort(function(a,b){return gen[a]-gen[b]||pos[a]-pos[b];})
    .forEach(function(i){var p=P[i];if(!overflowed(p))return;
      items.push({k:p.label||('#'+p.id),v:condText(p)});});
  var colW=(W-2*M-30)/2, chars=Math.max(20,Math.floor(colW/6.1));
  var cols=[[],[]],ci=0;
  items.forEach(function(it){
    cols[ci].push(wrapTo(it.k+'  '+it.v,chars));
    if(cols[0].length>cols[1].length+1)ci=1;});
  var maxRows=0;
  cols.forEach(function(c){var n=0;c.forEach(function(ls){n+=ls.length+0.35;});
    maxRows=Math.max(maxRows,n);});
  var notesH=items.length?(20+maxRows*15+8):0;
  var y0=headH+PH;
  var kl=kritLines();
  var kWrap=[];
  if(kl.length){
    kWrap.push({h:true,t:'* K GENETICKÉMU VYŠETŘENÍ — '+KRITERIA.verze});
    kl.forEach(function(l){
      wrapTo(l,Math.floor((W-2*M)/5.9)).forEach(function(x,ix){
        kWrap.push({h:false,t:x,i:ix>0});});});
  }
  var gl=KRIT?gdRiskLines():[];
  if(gl.length){
    kWrap.push({h:true,t:GDRISKHEAD});
    gl.forEach(function(l){
      wrapTo(l,Math.floor((W-2*M)/5.9)).forEach(function(x,ix){
        kWrap.push({h:false,t:x,i:ix>0});});});
  }
  var kH=kWrap.length?kWrap.length*13+10:0;
  var lg=(document.getElementById('legend')||{}).textContent||'';
  var lgLines=lg?wrapTo(lg,Math.floor((W-2*M)/5.2)):[];
  var lgH=lgLines.length?lgLines.length*12+12:0;
  var H=y0+notesH+kH+lgH+14;

  var out=E('svg',{xmlns:'http://www.w3.org/2000/svg',
    viewBox:'0 0 '+W+' '+H,width:W,height:H});
  var st=E('style');st.textContent=EXPCSS;out.appendChild(st);
  out.appendChild(E('rect',{x:0,y:0,width:W,height:H,fill:'#ffffff'}));
  if(t1)out.appendChild(E('text',{x:M,y:22,'class':'hd'},t1));
  if(t2)out.appendChild(E('text',{x:M,y:38,'class':'sub2'},t2));
  var g=E('g',{transform:'translate(0,'+headH+')'});
  while(clone.firstChild)g.appendChild(clone.firstChild);
  out.appendChild(g);
  if(items.length){
    out.appendChild(E('line',{x1:M,y1:y0+6,x2:W-M,y2:y0+6,
      stroke:'#1F3864','stroke-width':1.2}));
    out.appendChild(E('text',{x:M,y:y0+22,'class':'ntb'},'DALŠÍ POZNÁMKY'));
    cols.forEach(function(c,idx){
      var x=M+idx*(colW+30),yy=y0+40;
      c.forEach(function(ls){
        ls.forEach(function(l,li){
          out.appendChild(E('text',{x:x,y:yy,'class':(li===0?'ntb':'nt')},l));
          yy+=15;});
        yy+=5;});
    });
  }
  if(kWrap.length){
    var ky=y0+notesH+18;
    kWrap.forEach(function(o){
      out.appendChild(E('text',{x:M+(o.i?10:0),y:ky,
        'class':(o.h?'ntb':'nt')},o.t));ky+=13;});
  }
  if(lgLines.length){
    var ly=y0+notesH+kH+16;
    lgLines.forEach(function(l){
      out.appendChild(E('text',{x:M,y:ly,'class':'lg'},l));ly+=12;});
  }
  return new XMLSerializer().serializeToString(out);
}
/* Jméno pacienta do názvu souboru nepatří (stahované složky bývají
   synchronizované, názvy souborů zůstávají v historii a indexech) — soubor
   se jmenuje podle data (audit 5.10., S3). Jméno se do aplikace stejně
   nepíše, lepí se štítek po vytištění. */
function fileBase(){
  var d=new Date(),p=function(x){return (x<10?'0':'')+x;};
  return 'rodokmen-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+
    '-'+p(d.getHours())+p(d.getMinutes());
}
function dl(blob,name){
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=name;a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
}
function exportSVG(){
  dl(new Blob([buildExportSVG()],{type:'image/svg+xml'}),fileBase()+'.svg');
}
function exportPNG(){
  var svg=buildExportSVG(),SC=2.5;
  var m=svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
  var W=m?+m[1]:1400,H=m?+m[2]:800;
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas');
    c.width=Math.round(W*SC);c.height=Math.round(H*SC);
    var x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    x.drawImage(img,0,0,c.width,c.height);
    if(c.toBlob)c.toBlob(function(bl){
      if(bl)dl(bl,fileBase()+'.png');
      else notify('Export PNG se nezdařil, zkuste SVG.');},'image/png');
    else notify('Tento prohlížeč PNG export nepodporuje, použijte SVG.');
  };
  img.onerror=function(){notify('Export PNG se nezdařil, zkuste SVG.');};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

var IDF=['idName','idRc','idDate','idDoc','idDx'];
/* identifikace pacienta — do automatické zálohy v prohlížeči se NEUKLÁDÁ */
var IDF_PRIVATE=['idName','idRc'];
noSpell(document.getElementById('sheet'));    /* pole hlavičky (jméno, RČ, dg. …) */
/* Jméno a RČ se při zavření stránky smažou (AMISH_CLIPBOARD_PROTOCOL.md);
   hodinová záloha zůstává — bez nich, jako dosud (uživatelka 11. 10.). */
window.addEventListener('pagehide',function(){
  IDF_PRIVATE.forEach(function(i){var e=document.getElementById(i);if(e)e.value='';});});
var CASEV=2;
/* celý případ jako prostý objekt (uložení do souboru / záloha) */
function caseData(withIdentity){
  var s={};
  IDF.forEach(function(i){
    if(!withIdentity&&IDF_PRIVATE.indexOf(i)>-1)return;
    var e=document.getElementById(i);if(e)s[i]=e.value;});
  var d={v:CASEV,app:APPVER,P:P,U:U,nextP:nextP,nextU:nextU,sheet:s,
          consangChecked:CONSANG_CHECKED,otherFactsChecked:OTHERFACTS_CHECKED};
  /* druhá strana (rod druhého rodiče) jde do téhož souboru i zálohy —
     bez hlavičky, ta je společná */
  if(SIDES){var o=SIDES.other;
    d.sides={cur:SIDES.cur,other:{v:CASEV,P:o.P,U:o.U,nextP:o.nextP,nextU:o.nextU,
             consangChecked:!!o.cc,otherFactsChecked:!!o.of}};}
  return d;
}
function save(){

  UNSAVED=false;
}
/* Kontrola a pročištění načítaného případu (soubor i záloha). Dřív se
   převzalo cokoli: soubor bez „nextP“ nastavil 99 a nově přidaná osoba pak
   PŘEPSALA existující osobu s id 99; odkazy na neexistující osoby/svazky
   shodily kreslení. Vrací {ok,data} nebo {ok:false,err}. (audit 5.10., S4) */
function cleanEntry(t,strs,bools){
  var o={};
  /* pořadí polí zůstává (uložit → otevřít musí dát totéž) */
  Object.keys(t).forEach(function(k){
    var v=t[k];
    if(k==='flags'){
      o.flags={};
      if(v&&typeof v==='object'&&!Array.isArray(v))Object.keys(v).forEach(function(f){
        if(v[f]==='ano'||v[f]==='ne')o.flags[f]=v[f];});
      return;
    }
    if(v!==null&&typeof v==='object')return;
    if(strs.indexOf(k)>-1)v=String(v);
    else if(bools.indexOf(k)>-1)v=!!v;
    o[k]=v;
  });
  return o;
}
function validateCase(d){
  if(!d||typeof d!=='object'||!d.P||typeof d.P!=='object'||Array.isArray(d.P))
    return {ok:false,err:'Soubor neobsahuje rodokmen.'};
  var P2={},U2={},maxP=0,maxU=0;
  var STR=['label','yob','yod','age','adead','cond','hist','special','adopt','tested','cause'];
  Object.keys(d.P).forEach(function(k){
    var p=d.P[k],id=parseInt(k,10);
    if(!p||typeof p!=='object'||!(id>0))return;
    var q=newPersonShape(id);
    Object.keys(p).forEach(function(f){q[f]=p[f];});
    q.id=id;
    STR.forEach(function(f){q[f]=(q[f]==null)?'':String(q[f]);});
    if(['M','F','U'].indexOf(q.sex)<0)q.sex='U';
    q.n=Math.max(1,Math.min(30,parseInt(q.n,10)||1));
    ['tum','gd','twin'].forEach(function(f){if(!Array.isArray(q[f]))q[f]=[];});
    q.tum=q.tum.filter(function(t){return t&&typeof t==='object';});
    q.gd=q.gd.filter(function(t){return t&&typeof t==='object';});
    /* položky nádorů a genetických onemocnění po polích (audit #2, M12):
       texty jako text, † jako ano/ne, ano/ne otázky jen 'ano'/'ne'; vnořené
       neznámé objekty pryč — ručně upravený soubor nesmí shodit kreslení */
    q.tum=q.tum.map(function(t){return cleanEntry(t,['c','age','det','psa','gs','stage','polypCount','other'],['dc']);});
    q.gd=q.gd.map(function(t){return cleanEntry(t,['c','st','sub','age','det','other'],[]);});
    deadToHist(q);
    P2[id]=q;maxP=Math.max(maxP,id);
  });
  if(!Object.keys(P2).length)return {ok:false,err:'Soubor neobsahuje žádnou osobu.'};
  Object.keys(d.U||{}).forEach(function(k){
    var u=d.U[k],id=parseInt(k,10);
    if(!u||typeof u!=='object'||!(id>0))return;
    var a=P2[u.a]?+u.a:null,b=P2[u.b]?+u.b:null;
    var kids=(Array.isArray(u.kids)?u.kids:[]).map(Number).filter(function(c){return P2[c];});
    if(!a&&!b&&!kids.length)return;
    U2[id]={id:id,a:a,b:b,consang:!!u.consang,term:!!u.term,nokids:u.nokids||'',
            kids:kids,twin:u.twin||'',manual:!!u.manual};
    maxU=Math.max(maxU,id);
  });
  /* osoba ukazující na svazek, který není (nebo ji mezi dětmi nemá) */
  Object.keys(P2).forEach(function(i){
    var pu=P2[i].pu;
    if(pu!=null&&!(U2[pu]&&U2[pu].kids.indexOf(+i)>-1))P2[i].pu=null;});
  /* twin odkazy jen na existující osoby */
  Object.keys(P2).forEach(function(i){
    P2[i].twin=P2[i].twin.filter(function(t){return t&&P2[t.with];});});
  var out={P:P2,U:U2,
    nextP:Math.max(maxP+1,parseInt(d.nextP,10)||0),
    nextU:Math.max(maxU+1,parseInt(d.nextU,10)||0),
    sheet:(d.sheet&&typeof d.sheet==='object')?d.sheet:null,
    consangChecked:!!d.consangChecked,otherFactsChecked:!!d.otherFactsChecked,
    newer:(+d.v||0)>CASEV};
  /* druhá strana se ověří stejně přísně; poškozená se nenačte (hlavní ano) */
  if(d.sides&&typeof d.sides==='object'&&d.sides.other&&typeof d.sides.other==='object'&&!d.sides.other.sides){
    var vo=validateCase(d.sides.other);
    if(vo.ok)out.sides={cur:d.sides.cur===1?1:0,other:vo.data};
    else out.sidesBroken=true;
  }
  return {ok:true,data:out};
}
/* Převzetí ověřeného případu: když by se nedal nakreslit, vrátí se původní
   stav — dřív zůstal rozbitý model a autosave ho pak uložil. */
function applyCase(v){
  var prev=stateJSON(),prevSides=SIDES;
  try{
    SIDES=null;
    if(v.sides){var o=v.sides.other;
      SIDES={cur:v.sides.cur,other:{P:o.P,U:o.U,nextP:o.nextP,nextU:o.nextU,sel:null,
             cc:o.consangChecked,of:o.otherFactsChecked,hist:[],redo:[]}};
      withOtherSide(migrateTwins);}
    P=v.P;U=v.U;nextP=v.nextP;nextU=v.nextU;sel=null;
    migrateTwins();
    if(v.sheet)IDF.forEach(function(i){
      var e=document.getElementById(i);if(e&&v.sheet[i]!==undefined)e.value=String(v.sheet[i]);});
    CONSANG_CHECKED=v.consangChecked;OTHERFACTS_CHECKED=v.otherFactsChecked;
    hist=[];redoHist=[];   /* otevřený soubor je nový případ — Zpět nesmí sáhnout do toho předešlého */
    DRAW_DEPTH++;
    try{drawCore();}finally{DRAW_DEPTH--;}
    LASTGOOD=stateJSON();
    return true;
  }catch(e){
    SIDES=prevSides;
    restoreState(JSON.parse(prev));
    try{drawCore();}catch(e2){}
    return false;
  }
}
function load(f){
  var r=new FileReader();
  r.onload=function(){
    var d;
    try{d=JSON.parse(r.result);}catch(e){notify('Soubor se nepodařilo přečíst (není to uložený rodokmen).','err');return;}
    var v=validateCase(d);
    if(!v.ok){notify(v.err,'err');return;}
    if(!applyCase(v.data)){notify('Rodokmen ze souboru se nepodařilo nakreslit — zůstal původní.','err');return;}
    DIRTY=true;scheduleAutosave();
    if(v.data.newer)notify('Soubor je z novější verze aplikace — zkontrolujte údaje.','warn');
    else if(v.data.sidesBroken)notify('Druhou stranu (rod druhého rodiče) ze souboru se nepodařilo načíst — otevřena je jen první.','warn');
  };
  r.readAsText(f);
}

/* ===================== autosave (localStorage) ===================== */
/* Žádný server, žádný internet: ukládá se do localStorage prohlížeče, vázáno
   na tento konkrétní soubor (cestu) a profil prohlížeče. Zkopírovaný nebo
   přejmenovaný soubor začíná bez own historie — trvalá záloha je pořád
   tlačítko "Uložit" (stáhne .json, který jde kdykoli znovu otevřít). */
/* Pravidla zálohy (audit 5.10., S1, varianta A podle uživatelky):
   • jméno a rodné číslo se do prohlížeče NEUKLÁDAJÍ (IDF_PRIVATE);
   • záloha platí 24 hodin, pak se sama smaže — na sdíleném PC ji druhý
     den nikdo nenajde;
   • ukládá se teprve po skutečné úpravě (DIRTY) — otevřít stránku a nic
     nezměnit už zálohu nepřepíše;
   • dokud je nabídka obnovy otevřená, nic se nepřepisuje (RESTORE_PENDING);
   • „Vymazat zálohu“ v liště ji smaže hned. */
var AUTOSAVE_KEY='rodokmen_autosave_v1',autosaveTimer=null;
/* záloha platí 1 hodinu (uživatelka 6.10.: „omezit uloženou paměť na hodinu“) */
var AUTOSAVE_TTL=3600*1000,DIRTY=false,RESTORE_PENDING=false,DRAW_BROKEN=false;
/* neuložené změny od posledního „Uložit“/otevření souboru — při zavírání okna
   se prohlížeč zeptá, jestli opravdu odejít */
var UNSAVED=false;
function autosave(){
  if(!DIRTY||RESTORE_PENDING||DRAW_BROKEN)return;
  try{
    var d=caseData(false);d.ts=Date.now();
    localStorage.setItem(AUTOSAVE_KEY,JSON.stringify(d));
    var lab=document.getElementById('autosaveLab');
    if(lab){lab.textContent='Záloha '+new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'})+' ✕';
      lab.title='Automaticky zálohováno v tomto prohlížeči na 24 hodin (bez jména a rodného čísla). '+
                'Kliknutím zálohu hned smažete.';}
  }catch(e){/* úložiště nedostupné (zásada, kvóta, anonymní režim) — tiše přeskočit */}
}
function scheduleAutosave(){
  if(autosaveTimer)clearTimeout(autosaveTimer);
  autosaveTimer=setTimeout(autosave,600);
}
function clearAutosave(){
  try{localStorage.removeItem(AUTOSAVE_KEY);}catch(e){}
  var lab=document.getElementById('autosaveLab');if(lab){lab.textContent='';lab.title='';}
}
(function(){
  var lab=document.getElementById('autosaveLab');if(!lab)return;
  function wipe(){if(!lab.textContent)return;
    clearAutosave();DIRTY=false;   /* nepřepsat hned zase — až po další úpravě */
    notify('Záloha v prohlížeči smazána.','info');}
  lab.addEventListener('click',wipe);
  lab.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();wipe();}});
})();
window.addEventListener('beforeunload',function(e){
  if(autosaveTimer){clearTimeout(autosaveTimer);autosaveTimer=null;}
  autosave();      /* jistota, že i poslední necelou úpravu zachytí i bez čekání na debounce */
  /* rozpracovaná, neuložená práce → prohlížeč se zeptá „Opustit stránku?“ */
  if(UNSAVED){e.preventDefault();e.returnValue='';return '';}
});
IDF.forEach(function(i){
  var e=document.getElementById(i);
  if(!e)return;
  e.addEventListener('focus',function(){snap();});     /* hlavička jde vrátit Ctrl+Z */
  e.addEventListener('input',function(){DIRTY=true;UNSAVED=true;scheduleAutosave();});
});
/* Při startu: platná záloha → nabídka v liště (ne blokující confirm(),
   ten některé prohlížeče potichu zablokují). Prošlá nebo poškozená se smaže. */
function offerAutosave(){
  var d=null;
  try{var raw=localStorage.getItem(AUTOSAVE_KEY);if(raw)d=JSON.parse(raw);}catch(e){d=null;}
  if(!d)return;
  if(!d.ts||Date.now()-d.ts>AUTOSAVE_TTL){clearAutosave();return;}
  var v=validateCase(d);
  if(!v.ok){clearAutosave();return;}
  RESTORE_PENDING=true;
  var when=new Date(d.ts).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
  var nOs=Object.keys(v.data.P).length+(v.data.sides?Object.keys(v.data.sides.other.P).length:0);
  notify('Nalezena rozpracovaná práce z '+when+' — počet osob: '+nOs+(v.data.sides?', rod matky i otce':'')+' (bez jména a RČ; patří tomuto pacientovi?). '+
         'Dokud nevyberete, nic se automaticky neukládá.','info',[
    {t:'Obnovit',f:function(){RESTORE_PENDING=false;
      if(!applyCase(v.data))notify('Zálohu se nepodařilo nakreslit — zůstal nový rodokmen.','err');}},
    {t:'Zahodit',f:function(){RESTORE_PENDING=false;clearAutosave();}}]);
}

/* ===================== dvě strany (rod matky / rod otce) =====================
   Dítě se kreslí dvakrát — jednou rod matky, podruhé rod otce (šipka u toho
   rodiče). Dřív ve dvou záložkách prohlížeče; teď obě strany v jednom okně
   (8.10., uživatelka). Druhou stranu vytváří VÝHRADNĚ tlačítko — nic se
   nezakládá samo.
   Každá strana je úplný samostatný rodokmen (osoby, svazky, Zpět/Znovu,
   výběr). Aktivní strana žije v obvyklých globálních proměnných, ta druhá
   je odložená v SIDES.other. Přepnutí = uložit celou aktivní stranu a
   vzít celou druhou — nic se nekopíruje mezi nimi, nic se neslučuje.
   Hlavička listu (jméno, RČ, datum, indikace) je jedna, společná. */
var SIDES=null;      /* {cur:0|1, other:{P,U,nextP,nextU,sel,cc,of,hist,redo}} */
var PRINTCHOICE=null;
function sideSnapshot(){
  return {P:P,U:U,nextP:nextP,nextU:nextU,sel:sel,cc:CONSANG_CHECKED,of:OTHERFACTS_CHECKED,
          hist:hist,redo:redoHist};
}
function sideLoad(s){
  P=s.P;U=s.U;nextP=s.nextP;nextU=s.nextU;
  sel=(s.sel&&P[s.sel])?s.sel:null;
  CONSANG_CHECKED=!!s.cc;OTHERFACTS_CHECKED=!!s.of;
  hist=s.hist||[];redoHist=s.redo||[];
}
/* spustí fn nad druhou stranou (bez kreslení) a vrátí vše zpět */
function withOtherSide(fn){
  if(!SIDES)return null;
  var mine=sideSnapshot();
  sideLoad(SIDES.other);
  try{return fn();}
  finally{SIDES.other=sideSnapshot();sideLoad(mine);}
}
/* „Rod matky“ / „Rod otce“ podle toho, u kterého rodiče je šipka */
function sideName(){
  var fs=focusSide();
  return fs==='M'?'Rod matky':fs==='F'?'Rod otce':'Strana bez šipky';
}
function switchSide(){
  if(!SIDES)return;
  var mine=sideSnapshot();
  sideLoad(SIDES.other);
  SIDES.other=mine;SIDES.cur=1-SIDES.cur;
  /* pojistka kreslení nesmí při chybě „vrátit“ model DRUHÉ strany */
  LASTGOOD=null;
  draw();
}
/* proband může mít druhou stranu, jen je-li to dítě (rod každého rodiče na
   vlastní stránce) */
function sidesPossible(){var pr=theProband();return !!pr&&!adultProband();}
function createSecondSide(){
  if(SIDES)return;
  var pr=theProband();
  if(!sidesPossible()){notify('Druhá strana je jen pro dítě — rod matky a rod otce na dvou stránkách.','warn');return;}
  var fs=focusSide();
  if(!fs){notify('Nejdřív dejte šipku (K) rodiči, jehož rod je na této stránce — matce, nebo otci. '+
    'Druhá strana pak dostane šipku u druhého rodiče.','warn');return;}
  var src=JSON.parse(JSON.stringify({P:P,U:U}));
  var pp=parentsOf(pr.id),pu=P[pr.id].pu;
  /* dítě, jeho plní sourozenci a všichni jejich potomci (i s partnery) */
  var keepP={},keepU={},queue=[pr.id].concat(sibsOf(pr.id));
  queue.forEach(function(i){keepP[i]=1;});
  if(pu)keepU[pu]=1;
  while(queue.length){
    var x=queue.shift();
    unionsOf(x).forEach(function(u){
      if(u.id==pu)return;
      keepU[u.id]=1;
      [u.a,u.b].forEach(function(q){if(q&&P[q])keepP[q]=1;});
      u.kids.forEach(function(k){if(P[k]&&!keepP[k]){keepP[k]=1;queue.push(k);}});
    });
  }
  /* Druhá strana = dítě a sourozenci pod JEDNÍM rodičem — tím druhým (se
     šipkou). Rodič první strany se sem vůbec nekreslí (uživatelka 8.10.:
     „vyměnit pohlaví rodiče, předchozího rodiče nepřidávat“). Byl-li druhý
     rodič na první straně už zakreslen, převezme se jeho vlastní záznam
     (bez rodu), jinak vznikne nový prázdný. */
  var otherPar=(fs==='M')?pp[0]:pp[1];
  if(otherPar)keepP[otherPar]=1;
  var NP={},NU={},nP=nextP,nU=nextU;
  Object.keys(keepP).forEach(function(i){
    var q=src.P[i];
    if(!keepU[q.pu])q.pu=null;
    q.twin=(q.twin||[]).filter(function(t){return keepP[t.with];});
    q.consultand=false;
    NP[i]=q;});
  Object.keys(keepU).forEach(function(k){
    var u=src.U[k];
    u.kids=u.kids.filter(function(c){return keepP[c];});
    if(u.a&&!keepP[u.a])u.a=null;
    if(u.b&&!keepP[u.b])u.b=null;
    NU[k]=u;});
  var U0=NU[pu],focus=otherPar;
  if(!focus){var np=newPersonShape(nP++);np.sex=(fs==='M')?'M':'F';NP[np.id]=np;focus=np.id;}
  if(fs==='M'){U0.a=focus;U0.b=null;}else{U0.b=focus;U0.a=null;}
  /* šipka u druhého rodiče, nad ním prázdní rodiče (jako „Standardní“) */
  NP[focus].consultand=true;
  var gf=newPersonShape(nP++),gm=newPersonShape(nP++);gf.sex='M';gm.sex='F';
  /* označení jako u šablony „Standardní“ (rodič II-1, jeho rodiče I-1 a I-2) —
     ne převzaté „II-2“ z první strany, kde stál vedle partnera */
  /* …a nad nimi ještě jejich rodiče (uživatelka 8.10.: výchozí strana sahá
     až k prarodičům rodiče) — čtyři generace jako šablona: I-1…I-4
     praprarodiče dítěte, II-1/II-2 jeho prarodiče, III-1 rodič, IV-1 dítě */
  var gg=[];
  [gf,gm].forEach(function(g){
    var a=newPersonShape(nP++),b=newPersonShape(nP++);a.sex='M';b.sex='F';
    NP[a.id]=a;NP[b.id]=b;gg.push(a,b);
    var uu={id:nU++,a:a.id,b:b.id,consang:false,term:false,nokids:'',kids:[g.id],twin:''};
    NU[uu.id]=uu;g.pu=uu.id;});
  /* označení (I-1…IV-1) dopočítá autoLabel při prvním nakreslení strany */
  NP[gf.id]=gf;NP[gm.id]=gm;
  var gu={id:nU++,a:gf.id,b:gm.id,consang:false,term:false,nokids:'',kids:[focus],twin:''};
  NU[gu.id]=gu;NP[focus].pu=gu.id;
  SIDES={cur:0,other:{P:NP,U:NU,nextP:nP,nextU:nU,sel:focus,cc:CONSANG_CHECKED,of:OTHERFACTS_CHECKED,
                      hist:[],redo:[]}};
  DIRTY=true;UNSAVED=true;
  switchSide();
  notify('Vytvořena druhá strana ('+sideName().toLowerCase()+'): dítě a sourozenci (i s údaji) pod druhým rodičem se šipkou, '+
    'nad ním prázdní prarodiče. Mezi stranami přepínejte nahoře v liště „Strana“.','info');
}
function removeSide(active){
  if(!SIDES)return;
  notify('Odebrat '+(active?'tuto':'druhou')+' stranu ('+(active?sideName():withOtherSide(sideName)).toLowerCase()+
    ')? Její rodokmen se smaže.','warn',[
    {t:'Odebrat',f:function(){
      if(active)switchSide();
      SIDES=null;DIRTY=true;UNSAVED=true;draw();}},
    {t:'Ponechat',f:function(){}}]);
}
function renderSides(){
  var g=document.getElementById('sideGrp'),box=document.getElementById('sideBtns');
  if(!g||!box)return;
  if(!SIDES&&!sidesPossible()){g.hidden=true;return;}
  g.hidden=false;box.textContent='';
  function btn(t,title,cls,f){var b=document.createElement('button');b.textContent=t;b.title=title;
    if(cls)b.className=cls;b.onclick=f;box.appendChild(b);return b;}
  if(!SIDES){
    btn('+ Druhá strana','Založí druhou stránku pro rod druhého rodiče: dítě a sourozenci (i s údaji) '+
      'se zkopírují pod druhého rodiče se šipkou.','',createSecondSide);
    return;
  }
  var names=[];names[SIDES.cur]=sideName();names[1-SIDES.cur]=withOtherSide(sideName);
  [0,1].forEach(function(i){
    btn(names[i],i===SIDES.cur?'Právě upravovaná strana':'Přepnout na tuto stranu',
        i===SIDES.cur?'on':'',function(){if(i!==SIDES.cur)switchSide();});
  });
  btn('×','Odebrat tuto stranu','',function(){removeSide(true);});
}
/* jedna strana jako části textu (pro „Obě strany“) */
function sideParts(){
  var pr=theProband();if(!pr)return null;
  var fs=focusSide();if(!fs)return null;
  ANCH=reportAnchor();
  try{
    var cons=false;for(var k in U)if(U[k].consang)cons=true;
    var pp=parentsOf(pr.id);
    return {fs:fs,cons:cons,cc:CONSANG_CHECKED,of:OTHERFACTS_CHECKED,
      sibs:sibsSentence(pr.id,anchorWord(ANCH)),
      head:branchHead(fs)+':',lines:branchLines(fs,pp)};
  }finally{ANCH=null;}
}
/* Obě strany najednou: sourozenci dítěte jednou, pak ROD MATKY a ROD OTCE.
   Vrací {text,hint}. */
function genTextBoth(){
  if(!SIDES)return {text:genText(),hint:''};
  var a=sideParts(),b=withOtherSide(sideParts);
  if(!a||!b||a.fs===b.fs)return {text:'Pro „Obě strany“ musí mít každá strana šipku u jiného rodiče '+
    '(na jedné matka, na druhé otec).',hint:''};
  var mo=a.fs==='M'?a:b,fa=a.fs==='M'?b:a,hint='';
  var L=['Genealogie:','==================='];
  if(a.cons||b.cons)L.push('- V rodině udávána příbuznost rodičů — doplnit stupeň.');
  else if(a.cc||b.cc)L.push('- Příbuzenské vztahy v rodině neuvádí');
  /* liší-li se sourozenci na obou stranách, do textu jdou OBĚ verze s výzvou
     ke sjednocení — nic se potichu nevypustí (audit 8.10., G1) */
  if(a.sibs&&b.sibs&&a.sibs!==b.sibs){
    L.push('- Sourozenci jsou na stranách zapsáni různě — sjednotit:');
    L.push('- (rod matky) '+mo.sibs);
    L.push('- (rod otce) '+fa.sibs);
    hint='Sourozenci dítěte se na obou stranách liší — v textu jsou obě verze, sjednoťte je.';
  } else if(a.sibs||b.sibs)L.push('- '+(a.sibs||b.sibs));
  L.push(mo.head);L=L.concat(mo.lines);
  L.push(fa.head);L=L.concat(fa.lines);
  if(a.of||b.of)L.push('Další genealogicky významné skutečnosti neuvádí, podrobněji viz karta ÚLGG.');
  return {text:L.join('\n'),hint:hint};
}

/* Nový případ / otevření souboru při neuložené práci (audit 8.10., R1): dřív
   jedno kliknutí smazalo celý rodokmen bez otázky a za 0,6 s přepsalo i zálohu.
   Teď se zeptá; před zahozením se záloha dopíše a nový prázdný strom ji
   nepřepíše, dokud v něm uživatel něco neudělá — starou práci jde do hodiny
   obnovit znovuotevřením stránky. */
function confirmDiscard(go){
  if(!UNSAVED){go();return;}
  notify('Rozpracovaný rodokmen není uložený (Uložit). Zahodit ho? Záloha zůstane hodinu '+
    'v prohlížeči — obnovíte ji znovuotevřením stránky.','warn',[
    {t:'Zahodit',f:function(){
      if(autosaveTimer){clearTimeout(autosaveTimer);autosaveTimer=null;}
      autosave();go();}},
    {t:'Ponechat',f:function(){}}]);
}

/* ===================== wiring ===================== */
document.getElementById('bStd').onclick=function(){confirmDiscard(function(){standard();DIRTY=false;UNSAVED=false;});};
document.getElementById('bBlank').onclick=function(){confirmDiscard(function(){blank();DIRTY=false;UNSAVED=false;});};
document.getElementById('bUndo').onclick=undo;
document.getElementById('bRedo').onclick=redo;
document.getElementById('bDel').onclick=delSel;
/* Příprava tisku musí proběhnout, ať se tiskne tlačítkem „Tisk A4“, přes
   Ctrl+P, nebo „Uložit jako PDF“ z nabídky prohlížeče — dřív se @page
   (A4 na šířku) i dláždice pro široký strom nastavily JEN tlačítkem. */
var PRINTPREP=false;
function preparePrint(){
  if(PRINTPREP)return;PRINTPREP=true;
  printCSS();
  /* jsou-li dvě strany, tiskne se obojí (i přes Ctrl+P); jen tuto stranu,
     když to uživatel vybral u tlačítka „Tisk A4“ */
  if(SIDES&&PRINTCHOICE!=='one'){buildBothPages();document.body.classList.add('both');return;}
  if(buildPrintTiles()>1)document.body.classList.add('tiled');
}
/* stránky obou stran do #printBoth: aktuální strana tak, jak je nakreslená,
   druhá se na chvíli nakreslí, zkopíruje a hned se vrátí aktuální */
function buildBothPages(){
  var old=document.getElementById('printBoth');if(old)old.remove();
  var host=document.createElement('div');host.id='printBoth';
  var pages=[];
  function pageOf(pre){
    /* moc široká strana → své dláždice (víc listů), jinak kopie celého listu */
    if(PEDWIDE&&buildPrintTiles(pre)>1){
      var th=document.getElementById('printTiles'),out=[];
      while(th.firstChild)out.push(th.removeChild(th.firstChild));
      th.remove();return out;
    }
    var t0=document.getElementById('printTiles');if(t0)t0.remove();
    var sh=document.getElementById('sheet'),cl=sh.cloneNode(true);
    /* hodnoty polí hlavičky se klonem nepřenesou — zapsat je do atributů */
    IDF.forEach(function(k){var e=document.getElementById(k),c=cl.querySelector('#'+k);
      if(e&&c)c.setAttribute('value',e.value);});
    /* vzory/ořezy v kresbě: vlastní id, odkazy url(#…) na ně (originál je při
       tisku skrytý a duplicitní id by se pletla) */
    var svg=cl.querySelector('svg');
    if(svg){
      suffixSvgIds(svg,pre);
      Array.prototype.forEach.call(svg.querySelectorAll('.hit'),function(e){e.parentNode.removeChild(e);});
    }
    var w=document.createElement('div');w.className='pboth';w.appendChild(cl);
    return [w];
  }
  var mine=pageOf('_sa'),selKeep=sel,other;
  withOtherSideDrawn(function(){other=pageOf('_sb');});
  sel=selKeep;
  pages=(SIDES.cur===0)?mine.concat(other):other.concat(mine);
  pages.forEach(function(p){host.appendChild(p);});
  document.body.appendChild(host);
  return pages.length;
}
/* jako withOtherSide, ale druhá strana se opravdu nakreslí (pro tisk) a pak
   se nakreslí zpět ta aktuální */
function withOtherSideDrawn(fn){
  var mine=sideSnapshot();
  sideLoad(SIDES.other);sel=null;
  try{LASTGOOD=null;draw();fn();}
  finally{var o=sideSnapshot();o.sel=SIDES.other.sel;SIDES.other=o;
    sideLoad(mine);LASTGOOD=null;draw();}
}
window.addEventListener('beforeprint',preparePrint);
window.addEventListener('afterprint',function(){
  PRINTPREP=false;PRINTCHOICE=null;
  document.body.classList.remove('tiled');document.body.classList.remove('both');
  var host=document.getElementById('printTiles');if(host)host.remove();
  var hb=document.getElementById('printBoth');if(hb)hb.remove();
});
document.getElementById('bPrint').onclick=function(){
  if(!SIDES){preparePrint();window.print();return;}
  notify('Tisk:','info',[
    {t:'Obě strany (2 listy)',f:function(){PRINTCHOICE='both';preparePrint();window.print();}},
    {t:'Jen tuto stranu ('+sideName().toLowerCase()+')',f:function(){PRINTCHOICE='one';preparePrint();window.print();}}]);
};
document.getElementById('bText').onclick=showText;
document.getElementById('bKrit').onclick=function(){
  KRIT=!KRIT;this.className=KRIT?'on':'';draw();};
document.getElementById('bPng').onclick=exportPNG;
document.getElementById('bSvg').onclick=exportSVG;
document.getElementById('bSave').onclick=save;
document.getElementById('bLoad').onclick=function(){
  confirmDiscard(function(){document.getElementById('fLoad').click();});};
document.getElementById('fLoad').onchange=function(){
  if(this.files[0])load(this.files[0]);};
document.getElementById('bSort').onclick=sortByBirth;
document.getElementById('bFit').onclick=function(){ZOOM=null;applyZoom();};
document.getElementById('bZi').onclick=function(){
  var cur=parseFloat(document.getElementById('zLab').textContent)/100||1;
  ZOOM=Math.min(2,cur+0.1);applyZoom();};
document.getElementById('bZo').onclick=function(){
  var cur=parseFloat(document.getElementById('zLab').textContent)/100||1;
  ZOOM=Math.max(0.2,cur-0.1);applyZoom();};
document.querySelectorAll('#topbar [data-add]').forEach(function(b){
  b.onclick=function(){addRel(b.getAttribute('data-add'));};});
document.querySelectorAll('#topbar [data-sex]').forEach(function(b){
  b.onclick=function(){if(!sel||!P[sel])return;
    snap();P[sel].sex=b.getAttribute('data-sex');draw();};});
document.querySelectorAll('#topbar [data-mv]').forEach(function(b){
  b.onclick=function(){move(+b.getAttribute('data-mv'));};});
document.addEventListener('keydown',function(e){
  var t=e.target.tagName;
  /* SELECT taky: písmeno v rozbaleném výběru (M = Marfan) je hledání, ne
     zkratka — jinak by přepnulo pohlaví, Del by smazal osobu */
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){undo();e.preventDefault();return;}
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){
    redo();e.preventDefault();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key.toLowerCase(),p=sel?P[sel]:null;
  /* Shift+P = proband (B funguje také); samotné P přidává potomka.
     Shift+O / Shift+M = nevlastní sourozenec po otci / po matce (samotné
     M přepíná pohlaví na muže, proto až se Shiftem). */
  if(e.shiftKey){
    if(k==='p'&&p&&!p.proband){snap();
      for(var ip in P)P[ip].proband=false;p.proband=true;draw();e.preventDefault();}
    else if(k==='o'){addRel('halfF');e.preventDefault();}
    else if(k==='m'){addRel('halfM');e.preventDefault();}
    return;
  }
  if(k==='r'){addRel('par');}
  else if(k==='s'){addRel('sib');}
  else if(k==='w'){addRel('partner');}
  else if(k==='c'||k==='p'){addRel('child');}
  else if(e.key==='Delete'){delSel();}
  else if(e.key==='ArrowLeft'){move(-1);}
  else if(e.key==='ArrowRight'){move(1);}
  else if(!p)return;
  else if(k==='m'){snap();p.sex='M';draw();}
  else if(k==='f'||k==='z'){snap();p.sex='F';draw();}
  else if(k==='a'){snap();p.aff=p.aff===1?0:1;draw();}
  else if(k==='d'){snap();setDead(p,!p.dead);draw();}
  else if(k==='k'){snap();p.consultand=!p.consultand;draw();}
  else if(k==='b'){if(!p.proband){snap();for(var i in P)P[i].proband=false;
    p.proband=true;draw();}}
  else return;
  e.preventDefault();
});
document.getElementById('idDate').value=new Date().toLocaleDateString('cs-CZ');
printCSS();
standard();hist=[];redoHist=[];DIRTY=false;   /* výchozí strom zálohu nepřepíše */
offerAutosave();
paint();
</script>
